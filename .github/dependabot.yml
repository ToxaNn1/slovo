version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The site's Astro stack (apps/site pins it exactly) comes in a pull
      # request of its own, so it never rides along with the app's updates.
      # A dependency joins the first group it matches.
      site:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - '@fontsource-variable/*'
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint only supports TypeScript below 6.1 (its peer range);
      # raise this bound once it supports a newer TypeScript.
      - dependency-name: typescript
        versions: ['>=6.1']
      # Node is pinned to 22 (.nvmrc); its types follow that major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # React, React Native and the Expo ecosystem must match the Expo SDK
      # (expo/bundledNativeModules.json). They move together with an SDK
      # upgrade via `expo install --fix`, never one by one.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'

  # The Node base image of Dockerfile and recordings.Dockerfile, pinned by
  # digest; Node stays on 22 (.nvmrc).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
