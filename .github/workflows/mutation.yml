name: Mutation testing

# Stryker over the Core (ADR 0097): it changes the Core's code one mutant at a
# time and checks that a test fails. Too slow for a pull request, so it runs
# weekly on `main` and on demand. It reports the score and fails nothing until
# the owner sets a floor.
on:
  schedule:
    - cron: '40 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  core:
    name: Mutation testing of the Core
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The incremental file of the last run. Each run saves its own under a
      # new key, and the next one restores the newest by the prefix.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/core/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-
      # A full run takes hours on a runner, and later runs test only the
      # mutants of changed code and tests. Stopped before the job's limit,
      # Stryker saves what it has tested so far, so the next run goes on
      # from there and an unfinished run fails nothing either.
      - id: stryker
        name: Run Stryker
        working-directory: packages/core
        shell: bash
        run: |
          status=0
          timeout --kill-after=5m 270m ./node_modules/.bin/stryker run || status=$?
          if [ "$status" = 124 ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
      - if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/core/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
      - name: Publish the mutation score to the job summary
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PARTIAL: ${{ steps.stryker.outputs.partial }}
        run: |
          report=packages/core/reports/mutation/mutation.json
          {
            echo "## Mutation score of the Core"
            if [ "$PARTIAL" = true ]; then
              echo "The run stopped at its time limit; the next run goes on from its incremental file."
            elif [ -f "$report" ]; then
              node -e '
                const { files } = require(require("node:path").resolve(process.argv[1]));
                const count = {};
                for (const { mutants } of Object.values(files))
                  for (const { status } of mutants) count[status] = (count[status] ?? 0) + 1;
                const n = (status) => count[status] ?? 0;
                const detected = n("Killed") + n("Timeout");
                const valid = detected + n("Survived") + n("NoCoverage");
                const score = valid ? ((100 * detected) / valid).toFixed(2) : "n/a";
                console.log(`**${score}%**: ${detected} of ${valid} mutants detected.`);
                console.log("");
                for (const [status, total] of Object.entries(count).sort()) console.log(`- ${status}: ${total}`);
              ' "$report"
            else
              echo "No report: the run ended before Stryker wrote one."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: packages/core/reports/mutation/mutation.html
          if-no-files-found: ignore
          retention-days: 30
