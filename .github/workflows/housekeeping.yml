name: Housekeeping

# The checks that depend on the outside world or only report, not on the
# change under review: a new advisory or a stale Knip report must not turn a
# pull request red and hold up its auto-merge. They run once a day on `main`
# and on demand.
on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Only high and critical advisories fail the run, to keep it quiet.
      - run: pnpm audit --audit-level high

  knip:
    name: Unused code and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A report, not a gate, until the owner decides to make it blocking.
      - name: Report unused code and dependencies
        shell: bash
        run: |
          {
            echo '## Knip report'
            echo '```text'
            pnpm knip 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
