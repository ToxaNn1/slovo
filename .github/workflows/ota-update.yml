name: OTA update

# Publishes a signed OTA update of one Edition to its Update channel, to a
# share of its readers (ADR 0062). Started by hand only: Actions → OTA update →
# Run workflow. Publishing is never a side effect of merging, so there is no
# push trigger. A first run publishes the update to the rollout percentage and
# prints its update group; a second run with that group widens the rollout.
#
# The repository secret EXPO_TOKEN signs in to EAS. The EAS environment
# "production" holds the bundle's EXPO_PUBLIC_* variables and the code-signing
# private key as the file variable UPDATES_PRIVATE_KEY (visibility
# "sensitive"); the key is never in the repository. The public certificate is
# apps/mobile/certs/certificate.pem.
on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition id; its Update channel has the same name
        required: true
        default: uk
      rollout:
        description: Rollout percentage, 1 to 100
        required: true
        default: '10'
      message:
        description: What the update changes (for a new update)
        required: false
      update-group:
        description: To widen a published update's rollout, its update group id; empty publishes a new update
        required: false

permissions:
  contents: read

# One publish per Edition at a time; a newer run waits rather than cancelling one.
concurrency:
  group: ota-update-${{ inputs.edition }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1
  EAS_CLI: eas-cli@24.13.0
  EAS_ENVIRONMENT: production
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  SLOVO_EDITION: ${{ inputs.edition }}
  ROLLOUT: ${{ inputs.rollout }}
  MESSAGE: ${{ inputs.message }}
  UPDATE_GROUP: ${{ inputs.update-group }}

jobs:
  publish:
    name: Publish or widen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the inputs
        shell: bash
        run: |
          if [[ ! "$SLOVO_EDITION" =~ ^[a-z0-9-]+$ || ! -f "editions/$SLOVO_EDITION/edition.json" ]]; then
            echo "::error::Unknown Edition \"$SLOVO_EDITION\": expected a folder editions/<edition-id>"
            exit 1
          fi
          if [[ ! "$ROLLOUT" =~ ^[0-9]+$ ]] || (( ROLLOUT < 1 || ROLLOUT > 100 )); then
            echo "::error::The rollout percentage is \"$ROLLOUT\": expected a whole number from 1 to 100"
            exit 1
          fi
          if [[ -n "$UPDATE_GROUP" && ! "$UPDATE_GROUP" =~ ^[0-9a-f-]+$ ]]; then
            echo "::error::The update group is \"$UPDATE_GROUP\": expected an update group id"
            exit 1
          fi
          if [[ -z "$UPDATE_GROUP" && -z "$MESSAGE" ]]; then
            echo "::error::A new update needs a message"
            exit 1
          fi
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::The repository secret EXPO_TOKEN is not set"
            exit 1
          fi

      - name: Widen the rollout
        if: ${{ inputs.update-group != '' }}
        working-directory: apps/mobile
        shell: bash
        run: |
          npx --yes "$EAS_CLI" update:edit "$UPDATE_GROUP" --rollout-percentage "$ROLLOUT" --non-interactive
          echo "Update group \`$UPDATE_GROUP\` of the Edition \`$SLOVO_EDITION\` now reaches $ROLLOUT% of its channel." >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ inputs.update-group == '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ inputs.update-group == '' }}
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: ${{ inputs.update-group == '' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ inputs.update-group == '' }}
        run: pnpm build:pack "$SLOVO_EDITION"

      # The app accepts only an update signed with the key of this certificate.
      - name: Fetch the code-signing key
        if: ${{ inputs.update-group == '' }}
        working-directory: apps/mobile
        shell: bash
        run: |
          if [[ ! -f certs/certificate.pem ]]; then
            echo "::error::apps/mobile/certs/certificate.pem is missing, so the app would refuse a signed update"
            exit 1
          fi
          npx --yes "$EAS_CLI" env:exec "$EAS_ENVIRONMENT" \
            'test -f "$UPDATES_PRIVATE_KEY" && install -m 600 "$UPDATES_PRIVATE_KEY" "$RUNNER_TEMP/updates-private-key.pem"' \
            --non-interactive
          if [[ ! -s "$RUNNER_TEMP/updates-private-key.pem" ]]; then
            echo "::error::The EAS environment \"$EAS_ENVIRONMENT\" has no file variable UPDATES_PRIVATE_KEY"
            exit 1
          fi

      - name: Publish the signed update
        if: ${{ inputs.update-group == '' }}
        working-directory: apps/mobile
        shell: bash
        run: |
          npx --yes "$EAS_CLI" update \
            --channel "$SLOVO_EDITION" \
            --platform ios \
            --message "$MESSAGE" \
            --rollout-percentage "$ROLLOUT" \
            --environment "$EAS_ENVIRONMENT" \
            --private-key-path "$RUNNER_TEMP/updates-private-key.pem" \
            --non-interactive \
            --json > "$RUNNER_TEMP/update.json"
          group=$(jq -r '.[0].group' "$RUNNER_TEMP/update.json")
          ids=$(jq -r '[.[] | .platform + " " + .id] | join(", ")' "$RUNNER_TEMP/update.json")
          echo "Update group: $group"
          echo "Update id: $ids"
          {
            echo "Published to the channel \`$SLOVO_EDITION\` for $ROLLOUT% of its readers."
            echo
            echo "- Update group: \`$group\` (run again with it to widen the rollout)"
            echo "- Update id: \`$ids\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the code-signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/updates-private-key.pem"
