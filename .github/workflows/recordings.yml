# Generates the Recordings of an Edition's Words in its Narrator Voices and
# commits them to the branch it ran on (ADR 0083). Start it by hand, or push
# a change of tools/recordings/request.json to a branch. It never runs on, or
# pushes to, main.
name: Recordings

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Edition id
        default: uk
      only:
        description: Which Words to record
        type: choice
        options: [missing, all]
        default: missing
  push:
    branches-ignore: [main]
    paths: [tools/recordings/request.json]

permissions:
  contents: write

concurrency:
  group: recordings-${{ github.ref }}

jobs:
  generate:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Name the model and venv folders
        run: |
          echo "MODEL_DIR=$RUNNER_TEMP/model" >> "$GITHUB_ENV"
          echo "VENV_DIR=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
      - name: Read the request
        id: request
        env:
          EDITION: ${{ inputs.edition }}
          ONLY: ${{ inputs.only }}
        run: |
          edition="${EDITION:-$(jq -r .edition tools/recordings/request.json)}"
          only="${ONLY:-$(jq -r .only tools/recordings/request.json)}"
          case "$only" in all|missing) ;; *) echo "only must be all or missing"; exit 1 ;; esac
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          echo "only=$only" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: pipx install uv
      - run: tools/recordings/setup.sh "$VENV_DIR"
      - run: tools/recordings/fetch-model.sh "$MODEL_DIR"
      - name: List the Recordings to make
        env:
          EDITION: ${{ steps.request.outputs.edition }}
          ONLY: ${{ steps.request.outputs.only }}
        run: |
          pnpm --silent recording-requests "$EDITION" --only all --out "$RUNNER_TEMP/all.json"
          pnpm --silent recording-requests "$EDITION" --only "$ONLY" --out "$RUNNER_TEMP/requests.json"
          echo "$(jq length "$RUNNER_TEMP/requests.json") Recordings to make"
      - name: Stress spot-check
        run: |
          "$VENV_DIR/bin/python" -I "$PWD/tools/recordings/generate.py" \
            --model "$MODEL_DIR" --requests "$RUNNER_TEMP/all.json" --check | { grep -v '^RTF' || true; }
      - name: Generate
        env:
          EDITION: ${{ steps.request.outputs.edition }}
        run: |
          "$VENV_DIR/bin/python" -I "$PWD/tools/recordings/generate.py" \
            --model "$MODEL_DIR" --requests "$RUNNER_TEMP/requests.json" \
            --edition-dir "$PWD/editions/$EDITION" | { grep -v '^RTF' || true; }
      - name: Commit the Recordings
        env:
          EDITION: ${{ steps.request.outputs.edition }}
        run: |
          git add "editions/$EDITION/assets/recordings"
          if git diff --cached --quiet; then echo "No new Recordings"; exit 0; fi
          git -c user.name=anton -c user.email=antondemydenko113@gmail.com \
            commit -m "feat(edition): Recordings of $EDITION in its Narrator Voices"
          git push origin "HEAD:$GITHUB_REF_NAME"
