name: Maestro

# Builds the development client for the iOS Simulator on a macOS runner, without
# EAS, and runs one Maestro flow against it with Metro and the backend (ADR 0004).
# Started by hand: Actions → Maestro → Run workflow. It uses only local dev
# values; the backend's AUTH_SECRET is made fresh on each run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  SLOVO_EDITION: uk
  MAESTRO_VERSION: 2.11.0
  MAESTRO_CLI_NO_ANALYTICS: 1
  # The first start of Maestro's driver on a new simulator is slow on a runner.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
  DATABASE_URL: postgres://slovo:slovo@localhost:5432/slovo
  # Nothing listens there: the flow signs in to no Account, so no email is sent.
  SMTP_HOST: localhost
  SMTP_PORT: 1025
  PORT: 8787
  EXPO_PUBLIC_SLOVO_API_URL: http://localhost:8787
  METRO_PORT: 8081
  ARTIFACTS: ${{ github.workspace }}/maestro-artifacts

jobs:
  launch:
    name: Simulator build and launch.yaml
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p "$ARTIFACTS"
      - run: pnpm build:pack "$SLOVO_EDITION"

      # The native project, from the app config, as EAS makes it. Its Xcode
      # project gets fresh object ids on every prebuild, so the cache key below
      # hashes the inputs that shape it instead of the file itself.
      - name: Prebuild the iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install
      - name: Read the Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -s ' ' '-')" >> "$GITHUB_OUTPUT"
      # The development client changes only with a native change; the
      # JavaScript comes from Metro. A cached app skips the native build.
      - name: Restore the development client
        id: app-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/app
          key: >-
            simulator-app-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{
            hashFiles('.github/workflows/maestro.yml', 'pnpm-lock.yaml', 'apps/mobile/app.config.ts', 'apps/mobile/plugins/**',
            'apps/mobile/ios/**', '!apps/mobile/ios/**/project.pbxproj', 'apps/widget/**',
            'editions/uk/edition.json', 'editions/uk/assets/**', 'editions/uk/decor/**') }}
      - name: Install the pods
        if: ${{ steps.app-cache.outputs.cache-hit != 'true' }}
        working-directory: apps/mobile/ios
        run: pod install
      # Signed to run locally, with no team or profile: the simulator then
      # grants the app its entitlements, the Keychain and the App Group.
      - name: Build the development client for the iOS Simulator
        if: ${{ steps.app-cache.outputs.cache-hit != 'true' }}
        working-directory: apps/mobile/ios
        run: |
          if ! xcodebuild build \
            -workspace SLOVO.xcworkspace \
            -scheme SLOVO \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            > "$ARTIFACTS/xcodebuild.log" 2>&1; then
            grep -E 'error:' "$ARTIFACTS/xcodebuild.log" | head -50
            tail -40 "$ARTIFACTS/xcodebuild.log"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/app"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/SLOVO.app" "$RUNNER_TEMP/app/"

      # Postgres from Homebrew: a macOS runner has no Docker.
      - name: Start Postgres
        run: |
          brew install postgresql@17
          pg="$(brew --prefix postgresql@17)/bin"
          brew services start postgresql@17
          for _ in $(seq 30); do "$pg/pg_isready" --host=localhost && break; sleep 1; done
          "$pg/psql" --host=localhost --dbname=postgres \
            --command="CREATE ROLE slovo LOGIN SUPERUSER PASSWORD 'slovo'"
          "$pg/createdb" --host=localhost --owner=slovo slovo
      - name: Start the backend
        run: |
          pnpm --filter @slovo/backend db:migrate
          AUTH_SECRET="$(openssl rand -base64 32)" \
            nohup pnpm --filter @slovo/backend start > "$ARTIFACTS/backend.log" 2>&1 &
          for _ in $(seq 60); do curl -fs "http://localhost:$PORT/health" && exit 0; sleep 1; done
          echo "::error::The backend did not answer /health in 60 s"; exit 1
      - name: Start Metro
        working-directory: apps/mobile
        run: |
          CI=1 nohup pnpm start --port "$METRO_PORT" > "$ARTIFACTS/metro.log" 2>&1 &
          for _ in $(seq 120); do
            curl -fs "http://localhost:$METRO_PORT/status" | grep -q running && break
            sleep 1
          done
          # Bundle the app once now, from the address in the manifest, so the
          # development client finds it ready instead of waiting on a cold build.
          curl -fs -o "$ARTIFACTS/manifest.json" -H 'expo-platform: ios' \
            -H 'accept: application/expo+json,application/json' "http://localhost:$METRO_PORT"
          bundle="$(node -p 'require(process.argv[1]).launchAsset.url' "$ARTIFACTS/manifest.json")"
          echo "Bundling $bundle"
          time curl -fs -o /dev/null --max-time 600 "$bundle"

      - name: Boot a simulator and install the app
        run: |
          udid="$(xcrun simctl list devices available --json | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)); process.stdin.on("end", () => {
              const runtimes = Object.entries(JSON.parse(s).devices)
                .filter(([runtime]) => runtime.includes("iOS")).sort().reverse();
              for (const [, devices] of runtimes) {
                const phone = devices.find((device) => device.name.startsWith("iPhone"));
                if (phone) return console.log(phone.udid);
              }
              process.exit(1);
            });')"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/app/SLOVO.app"
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Run launch.yaml
        working-directory: apps/mobile
        run: |
          maestro test maestro/launch.yaml --udid "$UDID" \
            -e METRO_URL="http://localhost:$METRO_PORT" \
            --format junit --output "$ARTIFACTS/report.xml" \
            --test-output-dir "$ARTIFACTS/maestro" \
            --debug-output "$ARTIFACTS/maestro" --flatten-debug-output

      - name: Take a screenshot of the simulator
        if: ${{ !cancelled() && env.UDID != '' }}
        run: xcrun simctl io "$UDID" screenshot "$ARTIFACTS/simulator.png" || true
      - name: Upload the screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-launch
          path: maestro-artifacts
          retention-days: 14
