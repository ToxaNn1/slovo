name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes an older pull request run, but every push to main
  # keeps its own run, so a red main points at the commit that broke it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # The checks run as parallel jobs, so a PR is green in about the time of its
  # slowest one. Each job checks out and sets up on its own
  # (.github/actions/setup); the job "Lint, typecheck, test and Language Pack",
  # the check the ruleset requires, reports whether all of them passed.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck and package boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      # The package boundaries the ADRs set, import cycles, orphan modules and
      # unused exports of the Core's main entry.
      - run: pnpm deps

  # Which test parts a pull request can affect (ADR 0098, amending 0086):
  # those of the packages Turborepo counts as affected, changed or depending
  # on a changed package. An Edition's legal pages and pages.yml count for the
  # site, maestro.yml and ota-update.yml for the app; documentation counts for
  # nothing. A change outside the packages (an Edition's content, a root
  # config, the lockfile, a workflow, a script), a failed detection and every
  # push to main run every part. Lint, typecheck, the package boundaries, the
  # Contract and the Language Pack always cover the whole workspace.
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.parts.outputs.core }}
      ui: ${{ steps.parts.outputs.ui }}
      other: ${{ steps.parts.outputs.other }}
      other_filters: ${{ steps.parts.outputs.other_filters }}
      site: ${{ steps.parts.outputs.site }}
      admin: ${{ steps.parts.outputs.admin }}
      mobile: ${{ steps.parts.outputs.mobile }}
      backend: ${{ steps.parts.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Turborepo compares the pull request with its base.
          fetch-depth: 0
          persist-credentials: false
      - id: parts
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-affected-parts.mjs

  test:
    name: Test ${{ matrix.part.name }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every part reports, so one red part doesn't hide another.
      fail-fast: false
      matrix:
        part:
          - { name: Core, for: core, run: 'pnpm test --filter=@slovo/core' }
          # The UI's Vitest and Jest tests, cut in three like the app's.
          - {
              name: UI 1/3,
              for: ui,
              run: 'pnpm --filter=@slovo/ui exec vitest run --shard=1/3 && pnpm --filter=@slovo/ui exec jest --shard=1/3',
            }
          - {
              name: UI 2/3,
              for: ui,
              run: 'pnpm --filter=@slovo/ui exec vitest run --shard=2/3 && pnpm --filter=@slovo/ui exec jest --shard=2/3',
            }
          - {
              name: UI 3/3,
              for: ui,
              run: 'pnpm --filter=@slovo/ui exec vitest run --shard=3/3 && pnpm --filter=@slovo/ui exec jest --shard=3/3',
            }
          # The other packages but the backend, whose tests need Postgres: the
          # job "Backend" runs them. OTHER_FILTERS names the affected ones, or
          # leaves out the packages tested elsewhere when every part runs.
          - { name: other packages, for: other, run: 'pnpm test $OTHER_FILTERS' }
          - { name: site, for: site, run: 'pnpm test --filter=@slovo/site' }
          - { name: admin build, for: admin, run: 'pnpm --filter=@slovo/admin build' }
          - { name: app Vitest, for: mobile, run: 'pnpm --filter=@slovo/mobile exec vitest run' }
          # The app's Jest tests, the slowest part, cut in three.
          - {
              name: app 1/3,
              for: mobile,
              shard: 1,
              run: 'pnpm --filter=@slovo/mobile exec jest --shard=1/3',
            }
          - {
              name: app 2/3,
              for: mobile,
              shard: 2,
              run: 'pnpm --filter=@slovo/mobile exec jest --shard=2/3',
            }
          - {
              name: app 3/3,
              for: mobile,
              shard: 3,
              run: 'pnpm --filter=@slovo/mobile exec jest --shard=3/3',
            }
    env:
      # A part passes without running when the pull request can't affect it;
      # a skipped job would turn the required check red.
      RUN: ${{ needs.changes.outputs[matrix.part.for] == 'true' }}
      OTHER_FILTERS: ${{ needs.changes.outputs.other_filters }}
    steps:
      - if: ${{ env.RUN != 'true' }}
        run: echo 'The pull request does not affect this part.'
      - if: ${{ env.RUN == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ env.RUN == 'true' }}
        uses: ./.github/actions/setup
      # The app's Jest transforms, kept from run to run for each shard. React
      # Native loads most of its modules lazily, so on a cold cache the first
      # test to open, say, a sheet pays for Babel over dozens of them within
      # its 5 seconds. A transform is keyed by the file and the config, so an
      # older cache restored after a dependency change still serves every file
      # it holds.
      - if: ${{ env.RUN == 'true' && matrix.part.shard }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ matrix.part.shard }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/jest.config.js') }}
          restore-keys: jest-${{ runner.os }}-${{ matrix.part.shard }}-
      - if: ${{ env.RUN == 'true' }}
        run: ${{ matrix.part.run }}
      # In CI each test run writes a JUnit report and a coverage summary to its
      # package's coverage/ folder (packages/config/test-reports.js); the part
      # keeps them as an artifact for the test history.
      - name: Publish the coverage to the job summary
        id: reports
        if: ${{ !cancelled() && env.RUN == 'true' }}
        shell: bash
        env:
          PART: ${{ matrix.part.name }}
        run: |
          {
            echo "## Coverage of $PART"
            find apps packages tools -name node_modules -prune -o -name coverage-summary.json -print \
              | sort | xargs -r node -e '
                for (const file of process.argv.slice(1)) {
                  const { lines, branches } = require(`./${file}`).total;
                  const [where, runner] = file.split("/coverage/");
                  console.log(`- \`${where}\` ${runner.split("/")[0]}: lines ${lines.pct}%, branches ${branches.pct}%`);
                }'
          } >> "$GITHUB_STEP_SUMMARY"
          # An artifact's name takes no slash: "app 1/3" becomes "app-1-3".
          name="${PART//[ \/]/-}"
          echo "artifact=test-reports-$name" >> "$GITHUB_OUTPUT"
      - name: Upload the test reports and coverage
        if: ${{ !cancelled() && env.RUN == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.reports.outputs.artifact }}
          path: |
            apps/*/coverage/
            packages/*/coverage/
            tools/*/coverage/
          retention-days: 30

  pack:
    name: Contract and Language Pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The pack is built from the content snapshot of a local backend, as every
    # app build builds it from the Deployment's.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: slovo
          POSTGRES_PASSWORD: slovo
          POSTGRES_DB: slovo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slovo --dbname=slovo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://slovo:slovo@localhost:5432/slovo
      PORT: 8787
      EXPO_PUBLIC_SLOVO_API_URL: http://localhost:8787
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The contracts' tests hold the contract to the committed description of
      # /v1. This holds it to the one on the base branch too, so a description
      # edited by hand can't hide a breaking change (ADR 0031).
      - name: Check that the contract only adds to the base branch's /v1
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          promised=packages/contracts/src/api/v1.openapi.json
          if git cat-file -e "FETCH_HEAD:$promised" 2>/dev/null; then
            git show "FETCH_HEAD:$promised" > "$RUNNER_TEMP/promised.json"
            pnpm describe:api "$RUNNER_TEMP/promised.json"
          fi
      # The committed seed snapshot, imported into an empty database, served
      # by the backend. No email is sent: without ZEPTOMAIL_TOKEN they would go to Mailpit.
      - name: Import the Ukrainian seed snapshot and start the backend
        shell: bash
        run: |
          pnpm --filter @slovo/backend db:migrate
          pnpm --silent content import --edition uk --snapshot editions/uk/seed-snapshot.json
          AUTH_SECRET="$(openssl rand -base64 32)" \
            nohup pnpm --filter @slovo/backend start > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 60); do curl -fs "http://localhost:$PORT/health" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/backend.log"
          echo "::error::The backend did not answer /health in 60 s"; exit 1
      # Fails on invalid content; it lists the missed content targets and blocks
      # on none of them (ADR 0123).
      - name: Build the Ukrainian Language Pack
        id: pack
        shell: bash
        run: pnpm build:pack uk 2>&1 | tee "$RUNNER_TEMP/content-report.txt"
      - name: Publish the content report to the job summary
        if: ${{ !cancelled() && steps.pack.outcome != 'skipped' }}
        shell: bash
        run: |
          {
            echo '## Ukrainian content report'
            echo '```text'
            cat "$RUNNER_TEMP/content-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    # The check ruleset 26239313 requires: keep this name.
    name: Lint, typecheck, test and Language Pack
    if: ${{ always() }}
    needs: [lint, typecheck, changes, test, pack, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Red when any job above failed, was cancelled or was skipped.
      - name: Check that every job passed
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done

  # Pushes this run's tests, coverage and job durations to Якість (ADR 0096).
  # Runs on main only, after the checks; it never makes main red.
  ci-history:
    name: CI history
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the test reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'test-reports-*' --dir "$RUNNER_TEMP/reports" || true
      - name: Push the run to the CI history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLOVO_BACKEND_URL: ${{ secrets.SLOVO_BACKEND_URL }}
          CI_HISTORY_TOKEN: ${{ secrets.CI_HISTORY_TOKEN }}
        run: mkdir -p "$RUNNER_TEMP/reports" && node scripts/ci-history.mjs "$RUNNER_TEMP/reports"

  # Deploys the Railway project from main once every check passed (ADR 0104):
  # applies .railway/railway.ts, then uploads each service with `railway up`.
  # RAILWAY_TOKEN is a project token of the production environment; the CLI
  # reads it from the environment, so no step prints it.
  deploy:
    name: Deploy to Railway
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time: a newer push waits for the running deploy and
    # replaces any deploy still waiting.
    concurrency:
      group: railway-deploy
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # The Railway CLI, pinned; the root `railway` package is the SDK that
      # .railway/railway.ts imports, and it needs this CLI 5.42.1 or newer.
      RAILWAY_CLI_VERSION: 5.71.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the Railway CLI
        run: npm install --global "@railway/cli@$RAILWAY_CLI_VERSION"
      # Without --confirm-destructive, an apply that would delete a resource
      # fails here instead of deleting it.
      - name: Apply the Railway project file
        run: railway config apply --yes
      - name: Deploy the services
        shell: bash
        run: |
          services=(backend alerts quote-check)
          # The recordings service builds recordings.Dockerfile, which comes
          # with the Media Store (ADR 0099).
          if [ -f recordings.Dockerfile ]; then services+=(recordings); fi
          for service in "${services[@]}"; do
            echo "Deploying $service"
            railway up --ci --service "$service"
          done
      # A content schema can tighten while Postgres still holds records the
      # old rule let through: the Patch and the snapshot then fail their output
      # validation and answer 500 (#1819). After the new backend has had its
      # health check time to roll out, ask for every Edition's snapshot, which
      # the CDN never caches; a red deploy reaches the owner's alerts.
      - name: Check every Edition's snapshot
        shell: bash
        env:
          SLOVO_BACKEND_URL: ${{ secrets.SLOVO_BACKEND_URL }}
        run: |
          if [ -z "$SLOVO_BACKEND_URL" ]; then
            echo 'SLOVO_BACKEND_URL is not set: the snapshot is not checked.'
            exit 0
          fi
          sleep 150
          failed=0
          for folder in editions/*/; do
            edition=$(basename "$folder")
            url="${SLOVO_BACKEND_URL%/}/v1/editions/$edition/content/snapshot"
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url")
              [ "$code" = 200 ] && break
              sleep 20
            done
            echo "$edition snapshot: $code"
            if [ "$code" != 200 ]; then
              echo "::error::The $edition snapshot answers $code: re-import the Edition's content (docs/deploy.md, Importing an Edition's content)"
              failed=1
            fi
          done
          exit "$failed"

  backend:
    name: Backend
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The same image as the local services in compose.yaml.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: slovo
          POSTGRES_PASSWORD: slovo
          POSTGRES_DB: slovo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slovo --dbname=slovo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://slovo:slovo@localhost:5432/slovo
      # Passes without running when the pull request can't affect the backend.
      RUN: ${{ needs.changes.outputs.backend }}
    steps:
      - if: ${{ env.RUN != 'true' }}
        run: echo 'The pull request does not affect the backend.'
      - if: ${{ env.RUN == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ env.RUN == 'true' }}
        uses: ./.github/actions/setup
      # Every migration, from an empty database.
      - if: ${{ env.RUN == 'true' }}
        run: pnpm --filter @slovo/backend db:migrate
      # Each test file makes its own database on the same server and drops it after.
      - if: ${{ env.RUN == 'true' }}
        run: pnpm test --filter=@slovo/backend

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: slovo
          POSTGRES_PASSWORD: slovo
          POSTGRES_DB: slovo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slovo --dbname=slovo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the image the Deployment runs (ADR 0063) and pushes it nowhere.
      - run: docker build --tag slovo-backend .
      # The image holds the backend's runtime alone: no expo or react-native.
      - name: Image size and contents
        shell: bash
        run: |
          docker image ls slovo-backend --format 'slovo-backend {{.Size}}'
          docker run --rm slovo-backend sh -c \
            '! ls /app/node_modules/.pnpm | grep -E "^(expo|react-native)@"'
      # As on Railway: the release command first, then the server, which must
      # answer /health. The ZeptoMail token is a placeholder: production refuses
      # to start without one, and nothing is sent here.
      - name: Migrate and start the image against Postgres
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/backend.env" <<EOF
          DATABASE_URL=postgres://slovo:slovo@localhost:5432/slovo
          AUTH_SECRET=$(openssl rand -base64 32)
          ZEPTOMAIL_TOKEN=ci
          MAIL_FROM=no-reply@example.com
          TRUSTED_PROXY_HOPS=1
          R2_ACCOUNT_ID=ci
          R2_BUCKET=ci
          R2_ACCESS_KEY_ID=ci
          R2_SECRET_ACCESS_KEY=ci
          MEDIA_BASE=https://media.example.com
          EOF
          run=(docker run --network host --env-file "$RUNNER_TEMP/backend.env")
          "${run[@]}" --rm slovo-backend pnpm db:migrate
          # The admin answers 404 until a Власник exists (ADR 0088).
          "${run[@]}" --rm slovo-backend pnpm admin owner add owner@example.com
          "${run[@]}" --detach --name backend slovo-backend
          for _ in $(seq 1 30); do
            if curl --silent --fail http://localhost:8787/health; then
              # The built owner admin, at /admin with its assets.
              curl --silent --fail http://localhost:8787/admin/ | grep -q '/admin/assets/' && exit 0
              break
            fi
            sleep 2
          done
          docker logs backend
          exit 1

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The gitleaks action lists the PR's commits to scan only those.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Free for repositories owned by a personal account; no licence key needed.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
