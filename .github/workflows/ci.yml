name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes an older pull request run, but every push to main
  # keeps its own run, so a red main points at the commit that broke it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test and Language Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The package boundaries the ADRs set, import cycles and orphan modules.
      - run: pnpm deps
      # Unused files, exports and dependencies. A report for now: it does not
      # fail the build until the owner decides to make it blocking. The report
      # goes to the job summary, since a step that never fails shows no warning.
      - name: Report unused code and dependencies
        shell: bash
        run: |
          {
            echo '## Knip report'
            echo '```text'
            pnpm knip 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm typecheck
      # The backend's tests need Postgres; the job "Backend" runs them.
      - run: pnpm test --filter='!@slovo/backend'
      # The contracts' tests hold the contract to the committed description of
      # /v1. This holds it to the one on the base branch too, so a description
      # edited by hand can't hide a breaking change (ADR 0031).
      - name: Check that the contract only adds to the base branch's /v1
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          promised=packages/contracts/src/api/v1.openapi.json
          if git cat-file -e "FETCH_HEAD:$promised" 2>/dev/null; then
            git show "FETCH_HEAD:$promised" > "$RUNNER_TEMP/promised.json"
            pnpm describe:api "$RUNNER_TEMP/promised.json"
          fi
      # Fails on invalid content and on any missed content target of the Edition.
      - name: Build the Ukrainian Language Pack and check its content targets
        id: pack
        shell: bash
        run: pnpm build:pack uk 2>&1 | tee "$RUNNER_TEMP/content-report.txt"
      - name: Publish the content report to the job summary
        if: ${{ !cancelled() && steps.pack.outcome != 'skipped' }}
        shell: bash
        run: |
          {
            echo '## Ukrainian content report'
            echo '```text'
            cat "$RUNNER_TEMP/content-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The same image as the local services in compose.yaml.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: slovo
          POSTGRES_PASSWORD: slovo
          POSTGRES_DB: slovo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slovo --dbname=slovo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://slovo:slovo@localhost:5432/slovo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every migration, from an empty database.
      - run: pnpm --filter @slovo/backend db:migrate
      # Each test run makes its own database on the same server and drops it after.
      - run: pnpm test --filter=@slovo/backend --filter=@slovo/server-core

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Only high and critical advisories fail the build, to keep it quiet.
      - run: pnpm audit --audit-level high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The gitleaks action lists the PR's commits to scan only those.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Free for repositories owned by a personal account; no licence key needed.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
