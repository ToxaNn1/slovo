name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes an older pull request run, but every push to main
  # keeps its own run, so a red main points at the commit that broke it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test and Language Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The package boundaries the ADRs set, import cycles and orphan modules.
      - run: pnpm deps
      - run: pnpm typecheck
      # The app's Jest transforms, kept from run to run. React Native loads
      # most of its modules lazily, so on a cold cache the first test to open,
      # say, a sheet pays for Babel over dozens of them within its 5 seconds.
      # A transform is keyed by the file and the config, so an older cache
      # restored after a dependency change still serves every file it holds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/mobile/node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/jest.config.js') }}
          restore-keys: jest-${{ runner.os }}-
      # The backend's tests need Postgres; the job "Backend" runs them.
      # `pnpm test` runs one package at a time (--concurrency=1): each test
      # runner already spreads over every core, and side by side they slowed
      # the app's screen tests eightfold, past Jest's 5 seconds a test.
      - run: pnpm test --filter='!@slovo/backend'
      # The contracts' tests hold the contract to the committed description of
      # /v1. This holds it to the one on the base branch too, so a description
      # edited by hand can't hide a breaking change (ADR 0031).
      - name: Check that the contract only adds to the base branch's /v1
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          promised=packages/contracts/src/api/v1.openapi.json
          if git cat-file -e "FETCH_HEAD:$promised" 2>/dev/null; then
            git show "FETCH_HEAD:$promised" > "$RUNNER_TEMP/promised.json"
            pnpm describe:api "$RUNNER_TEMP/promised.json"
          fi
      # Fails on invalid content and on any missed content target of the Edition.
      - name: Build the Ukrainian Language Pack and check its content targets
        id: pack
        shell: bash
        run: pnpm build:pack uk 2>&1 | tee "$RUNNER_TEMP/content-report.txt"
      - name: Publish the content report to the job summary
        if: ${{ !cancelled() && steps.pack.outcome != 'skipped' }}
        shell: bash
        run: |
          {
            echo '## Ukrainian content report'
            echo '```text'
            cat "$RUNNER_TEMP/content-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # The same image as the local services in compose.yaml.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: slovo
          POSTGRES_PASSWORD: slovo
          POSTGRES_DB: slovo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slovo --dbname=slovo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://slovo:slovo@localhost:5432/slovo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every migration, from an empty database.
      - run: pnpm --filter @slovo/backend db:migrate
      # Each test file makes its own database on the same server and drops it after.
      - run: pnpm test --filter=@slovo/backend

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: slovo
          POSTGRES_PASSWORD: slovo
          POSTGRES_DB: slovo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slovo --dbname=slovo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the image the Deployment runs (ADR 0063) and pushes it nowhere.
      - run: docker build --tag slovo-backend .
      # As on Railway: the release command first, then the server, which must
      # answer /health. The SMTP settings are placeholders: production refuses
      # to start without them, and nothing is sent here.
      - name: Migrate and start the image against Postgres
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/backend.env" <<EOF
          DATABASE_URL=postgres://slovo:slovo@localhost:5432/slovo
          AUTH_SECRET=$(openssl rand -base64 32)
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USER=ci
          SMTP_PASSWORD=ci
          MAIL_FROM=no-reply@example.com
          TRUSTED_PROXY_HOPS=1
          EOF
          run=(docker run --network host --env-file "$RUNNER_TEMP/backend.env")
          "${run[@]}" --rm slovo-backend pnpm db:migrate
          "${run[@]}" --detach --name backend slovo-backend
          for _ in $(seq 1 30); do
            if curl --silent --fail http://localhost:8787/health; then exit 0; fi
            sleep 2
          done
          docker logs backend
          exit 1

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The gitleaks action lists the PR's commits to scan only those.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Free for repositories owned by a personal account; no licence key needed.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
