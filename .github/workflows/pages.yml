name: Pages

# Builds apps/site, the Astro site (ADR 0071): at its root the UA Edition's
# landing, and each Edition's legal pages, editions/<edition-id>/legal/*.md,
# at /<edition-id>/<page>, e.g. /uk/privacy (ADR 0049). It deploys to GitHub
# Pages behind the custom domain that apps/site/public/CNAME names. Pages must
# be on in the repository settings with "GitHub Actions" as its source and
# that domain as its custom domain: a site deployed by a workflow takes the
# domain from the settings, so the published CNAME records it and a test
# keeps it equal to the AppConfig's domain (ADR 0065). The site reads every
# Edition file through packages/language-pack/src/edition-folder.ts (ADR 0035).

on:
  push:
    branches: [main]
    paths:
      - 'editions/*/legal/**'
      - 'editions/*/tokens.json'
      - 'editions/*/decor/decor.json'
      - 'editions/*/edition.json'
      - 'apps/site/**'
      - 'packages/contracts/**'
      - 'packages/language-pack/src/**'
      - 'packages/ui/src/tokens.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits rather than cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: pnpm install --frozen-lockfile --filter @slovo/site...
      # The path Pages serves the site under: /slovo at the github.io address,
      # empty behind the custom domain.
      - run: pnpm --filter @slovo/site build
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
