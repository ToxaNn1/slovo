name: Commit messages

# Its own workflow so that editing the PR title checks it again without
# running the whole of CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The squash merge makes the PR title the commit on main.
      - name: Check the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm commitlint
      - name: Check the PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      # Auto-merge squashes a green PR without anyone reading it, so the
      # owner's authorship rules (CLAUDE.md, Git) are checked here.
      - name: Check the authors and that no AI attribution is left
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: |
          status=0
          if git log --format='%ae' "$BASE_SHA..$HEAD_SHA" | grep -qvx 'antondemydenko113@gmail.com'; then
            echo "::error::Every commit must be authored by antondemydenko113@gmail.com"; status=1
          fi
          # The agent guide's file name is not an attribution.
          if git log --format='%B' "$BASE_SHA..$HEAD_SHA" | sed 's/CLAUDE\.md//g' | grep -qiE 'Co-Authored|Claude|Generated with'; then
            echo "::error::A commit message carries an AI attribution"; status=1
          fi
          if printf '%s' "$PR_TEXT" | sed 's/CLAUDE\.md//g' | grep -qiE 'Co-Authored|Claude|Generated with'; then
            echo "::error::The PR title or body carries an AI attribution"; status=1
          fi
          exit $status
