<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
[data-slovo][data-th="light"]{--bg:#FFF4E6;--ink:#140C0A;--sf:#FFFBF5;--sf2:#F5E4CF;--line:rgba(20,12,10,.13);--mute:#6B5D55;--tile:#FFFBF5;--edge:#DCC2A6}
[data-slovo][data-th="dark"]{--bg:#140C0A;--ink:#FFF4E6;--sf:#221714;--sf2:#2E201B;--line:rgba(255,244,230,.13);--mute:#BDAE9F;--tile:#33241F;--edge:#050302}
[data-slovo] *{box-sizing:border-box}
[data-slovo] button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
[data-rm="1"] *{animation-name:vcRm!important;animation-duration:.3s!important;animation-delay:0s!important;animation-iteration-count:1!important}
@keyframes vcRm{from{opacity:0}}
@keyframes vcCasc{from{opacity:0;transform:translateY(14px)}}
@keyframes vcPop{0%{transform:scale(.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes vcWave{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@keyframes vcSyl{0%,100%{transform:none}40%{color:#FFF4E6;transform:translateY(-5px)}}
</style>
</helmet>
<div data-slovo="1" data-th="{{ th }}" data-rm="{{ rmAttr }}" style="width:406px;height:860px;padding:8px;background:#0B0706;border-radius:62px;box-shadow:0 0 0 1.5px #3A2C27,0 30px 70px rgba(20,12,10,.35);font-family:'Onest',sans-serif;flex:none">
<div style="position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--bg,#FFF4E6);color:var(--ink,#140C0A)">
  <div style="position:absolute;inset:0;overflow-y:auto;padding:60px 0 40px">
    <div style="display:flex;align-items:center;gap:12px;padding:6px 16px 14px">
      <button aria-label="Назад" style="width:44px;height:44px;border-radius:14px;background:var(--sf2);display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24"><polygon points="15,2 19,6 12,12 19,18 15,22 4,12" fill="currentColor"></polygon></svg></button>
      <span style="font:800 20px/1.1 Unbounded,sans-serif">Голос диктора</span>
    </div>
    <div style="padding:0 20px 18px;font:400 15px/1.4 Onest;color:var(--mute);text-wrap:pretty">Хто читає слова вголос на картці та в іграх.</div>

    <sc-if value="{{ isB }}" hint-placeholder-val="{{ true }}">
      <div style="margin:0 16px;position:relative;border-radius:26px;background:#FF3B2F;color:#140C0A;overflow:hidden;padding:22px 20px 20px;display:flex;flex-direction:column;gap:16px">
        <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(20,12,10,.2) 1.1px,transparent 1.6px);background-size:6px 6px"></div>
        <span style="position:relative;font:700 11px/1 Unbounded,sans-serif;letter-spacing:1.5px">ЧИТАЄ · {{ curUp }}</span>
        <span style="position:relative;display:flex;gap:2px;font:900 40px/1 Unbounded,sans-serif;letter-spacing:-1.5px">
          <sc-for list="{{ syl }}" as="y" hint-placeholder-count="3"><span style="display:inline-block;color:{{ y.c }};animation:{{ y.anim }}">{{ y.t }}</span></sc-for>
        </span>
        <span style="position:relative;font:600 14px/1 Onest">за-гра́-ва · ім., ж. р.</span>
        <div style="position:relative;display:flex;align-items:center;gap:14px">
          <button onClick="{{ playCur }}" aria-label="Прослухати" style="flex:none;width:64px;height:64px;border-radius:18px;background:#140C0A;color:#FFF4E6;box-shadow:0 5px 0 rgba(20,12,10,.45);display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .08s" style-active="transform:translateY(4px);box-shadow:0 1px 0 rgba(20,12,10,.45)"><svg width="22" height="22" viewBox="0 0 20 20"><path d="{{ curIc }}" fill="currentColor"></path></svg></button>
          <span style="flex:1;display:flex;align-items:center;gap:4px;height:40px">
            <sc-for list="{{ bigBars }}" as="b" hint-placeholder-count="16"><span style="flex:1;height:{{ b.h }};background:#140C0A;animation:{{ b.anim }}"></span></sc-for>
          </span>
        </div>
      </div>
      <div style="padding:22px 20px 10px;font:700 11px/1 Unbounded,sans-serif;letter-spacing:1.5px;color:var(--mute)">ОБЕРІТЬ ГОЛОС</div>
      <div style="padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <sc-for list="{{ voices }}" as="o" hint-placeholder-count="4">
          <button onClick="{{ o.pick }}" style="height:64px;border-radius:16px;background:{{ o.cBg }};color:{{ o.cFg }};box-shadow:{{ o.cSh }};border:{{ o.cBd }};transform:{{ o.tTf }};padding:0 14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;text-align:left;transition:transform .12s,box-shadow .12s,background .2s;animation:{{ o.anim }}">
            <span style="font:900 15px/1 Unbounded,sans-serif">{{ o.n }}</span>
            <span style="font:500 12px/1 Onest;opacity:.75">{{ o.d }}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>

  </div>

  <div style="position:absolute;top:0;left:0;right:0;height:50px;z-index:99;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 44px;pointer-events:none;color:var(--ink)">
    <span style="font:600 16px/1 Onest,sans-serif">20:30</span>
    <div style="display:flex;align-items:center;gap:6px"><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" fill="currentColor"></rect><rect x="5" y="5.5" width="3" height="6.5" fill="currentColor"></rect><rect x="10" y="3" width="3" height="9" fill="currentColor"></rect><rect x="15" y="0" width="3" height="12" fill="currentColor"></rect></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".75" y=".75" width="21.5" height="10.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"></rect><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="currentColor"></rect></svg></div>
  </div>
  <div style="position:absolute;top:11px;left:50%;margin-left:-62px;width:124px;height:36px;border-radius:20px;background:#000;z-index:100"></div>
  <div style="position:absolute;bottom:8px;left:50%;margin-left:-67px;width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:100"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:406,&quot;height&quot;:860},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;playing&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const VOICES=[{n:'Оксана',d:'Жіночий · спокійний',p:1.15,r:.9,seed:[.4,.7,.55,.9,.6,.8,.5,.65,.45]},{n:'Тарас',d:'Чоловічий · низький',p:.7,r:.88,seed:[.8,.95,.7,1,.85,.6,.9,.75,.7]},{n:'Марта',d:'Жіночий · жвавий',p:1.35,r:1.05,seed:[.3,.9,.4,1,.35,.85,.5,.95,.4]},{n:'Остап',d:'Чоловічий · теплий',p:.9,r:.95,seed:[.6,.75,.85,.7,.9,.8,.65,.75,.6]}];
const PLAY='M5 2l13 8-13 8z',PAUSE='M4 3h4v14H4zM12 3h4v14h-4z';
class Component extends DCLogic {
  state={sel:null,play:null};
  componentWillUnmount(){clearTimeout(this.t);}
  say(i){const rm=!!this.props.reduceMotion;this.setState({play:i});try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Заграва');u.lang='uk-UA';u.pitch=VOICES[i].p;u.rate=VOICES[i].r;speechSynthesis.speak(u);}catch(e){}clearTimeout(this.t);this.t=setTimeout(()=>this.setState({play:null}),1500);}
  renderVals(){
    const p=this.props,s=this.state,dark=p.theme==='dark',rm=!!p.reduceMotion;
    const sel=s.sel??(p.selected??0),play=s.play??(p.playing?sel:null);
    const anim=(on,k)=>on?`vcWave ${.42+(k%3)*.08}s ${(k*.04).toFixed(2)}s ease-in-out infinite alternate`:'none';
    const v={th:dark?'dark':'light',rmAttr:rm?'1':'0',isB:true};
    v.voices=VOICES.map((x,i)=>{const on=i===sel,pl=play===i;
      return {...x,on,g:x.n[0],anim:`vcCasc .4s ${.05+i*.06}s both`,
        bars:x.seed.map((h,k)=>({h:Math.round(h*26)+'px',anim:anim(pl,k)})),
        wide:Array.from({length:28},(_,k)=>({h:Math.round((.25+.75*x.seed[k%9]*(.6+.4*Math.abs(Math.sin(k*1.7+i))))*28)+'px',anim:anim(pl,k)})),
        tBg:on?'#FF3B2F':'var(--tile)',tFg:on?'#140C0A':'var(--ink)',tSh:on?'inset 0 4px 0 rgba(20,12,10,.25)':'0 5px 0 var(--edge)',tTf:on?'translateY(4px)':'none',gOp:on?.18:.07,
        cBg:on?'var(--ink)':'var(--tile)',cFg:on?'var(--bg)':'var(--ink)',cSh:on?'inset 0 3px 0 rgba(0,0,0,.3)':'0 4px 0 var(--edge)',cBd:on?'0':'1px solid var(--line)',
        rBg:on?'var(--ink)':'var(--tile)',rFg:on?'var(--bg)':'var(--ink)',rSh:on?'none':'0 4px 0 var(--edge)',rBd:on?'0':'1px solid var(--line)',wC:on?(pl?'#FF3B2F':'var(--bg)'):(pl?'#FF3B2F':'var(--ink)'),
        pBg:pl?'#FF3B2F':(on?'rgba(255,244,230,.14)':'var(--sf2)'),pFg:pl?'#140C0A':'currentColor',ic:pl?PAUSE:PLAY,
        pick:()=>{this.setState({sel:i});this.say(i);},play:e=>{e.stopPropagation();this.say(i);}};});
    const pc=play!=null;
    v.curUp=VOICES[sel].n.toUpperCase();v.curIc=pc?PAUSE:PLAY;v.playLbl=pc?'ЧИТАЄ…':'ПОСЛУХАТИ';v.playCur=()=>this.say(sel);
    v.bigBars=Array.from({length:16},(_,k)=>({h:Math.round((.3+.7*VOICES[sel].seed[k%9])*40)+'px',anim:anim(pc,k)}));
    v.syl=['за','гра́','ва'].map((t,k)=>({t,c:k===1?'#FFF4E6':'#140C0A',anim:pc&&!rm?`vcSyl .5s ${k*.45}s`:'none'}));
    return v;
  }
}
</script>
</body>
</html>
