<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#EFE3D3}a{color:#C4271D}a:hover{color:#FF3B2F}textarea:focus{outline:2px solid #FF3B2F}button{border:0;font-family:inherit;cursor:pointer;color:inherit}</style>
</helmet>
<div style="height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);background:#EFE3D3;color:#140C0A;font-family:Onest,sans-serif">
  <header style="display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:14px 20px;background:#140C0A;color:#FFF4E6">
    <a href="SLOVO%2000%20Index.dc.html" style="height:38px;padding:0 12px;border-radius:10px;background:rgba(255,244,230,.12);color:#FFF4E6;display:flex;align-items:center;font:800 11px/1 Unbounded,sans-serif;text-decoration:none">00 ЗМІСТ</a>
    <span style="font:900 19px/1 Unbounded,sans-serif;letter-spacing:-.3px">SLOVO · <span style="color:#FF3B2F">Покрокова перевірка</span></span>
    <div style="flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px">
      <span style="font:600 13px/1 Onest">{{ progT }}</span>
      <span style="height:8px;border-radius:4px;background:rgba(255,244,230,.15);overflow:hidden;display:flex"><span style="width:{{ pOk }};background:#FF3B2F;transition:width .3s"></span><span style="width:{{ pBug }};background:#FFF4E6;transition:width .3s"></span></span>
    </div>
    <div style="display:flex;gap:6px">
      <sc-for list="{{ themeOpts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.onClick }}" style="height:38px;padding:0 12px;border-radius:10px;background:{{ o.bg }};color:{{ o.fg }};font:700 13px/1 Onest">{{ o.t }}</button></sc-for>
    </div>
    <button onClick="{{ toggleTodo }}" style="height:38px;padding:0 12px;border-radius:10px;background:{{ todoBg }};color:{{ todoFg }};font:700 13px/1 Onest">Лише неперевірені</button>
    <button onClick="{{ copyReport }}" style="height:38px;padding:0 14px;border-radius:10px;background:#FF3B2F;color:#140C0A;font:800 12px/1 Unbounded,sans-serif">{{ copyT }}</button>
  </header>
  <div style="min-height:0;display:grid;grid-template-columns:280px minmax(0,1fr) 340px">
    <nav style="min-height:0;overflow-y:auto;padding:14px 10px 40px;border-right:1px solid rgba(20,12,10,.12);display:flex;flex-direction:column;gap:14px">
      <sc-for list="{{ nav }}" as="ch" hint-placeholder-count="6">
        <div style="display:flex;flex-direction:column;gap:2px">
          <div style="display:flex;align-items:baseline;gap:8px;padding:4px 8px 6px"><span style="font:900 12px/1 Unbounded,sans-serif;color:#C4271D">{{ ch.id }}</span><span style="flex:1;font:800 13px/1.2 Unbounded,sans-serif">{{ ch.t }}</span><span style="font:600 11px/1 Onest;color:#6B5D55">{{ ch.cnt }}</span></div>
          <sc-for list="{{ ch.items }}" as="it" hint-placeholder-count="4">
            <button onClick="{{ it.onClick }}" style="display:flex;align-items:center;gap:10px;min-height:36px;padding:6px 8px;border-radius:10px;background:{{ it.bg }};color:{{ it.fg }};text-align:left;width:100%" style-hover="background:rgba(20,12,10,.06)">
              <span style="flex:none;width:30px;font:700 11px/1 Onest;opacity:.6">{{ it.i }}</span>
              <span style="flex:1;min-width:0;font:600 13px/1.25 Onest;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.l }}</span>
              <span style="flex:none;width:12px;height:12px;border-radius:3px;background:{{ it.dot }};border:{{ it.dotBd }}"></span>
            </button>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <main style="min-height:0;overflow:auto;padding:22px 26px 40px;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font:700 12px/1 Unbounded,sans-serif;letter-spacing:1px;color:#C4271D">{{ cur.kick }}</span>
        <span style="font:900 30px/1.1 Unbounded,sans-serif;letter-spacing:-.5px;text-wrap:balance">{{ cur.l }}</span>
        <sc-if value="{{ cur.live }}" hint-placeholder-val="{{ false }}"><span style="align-self:flex-start;padding:7px 10px;border-radius:8px;background:#FF3B2F;font:700 13px/1 Onest">Живий прототип — натискай, гортай і проходь сценарій руками</span></sc-if>
      </div>
      <sc-if value="{{ show }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;gap:28px;align-items:flex-start">
          <sc-for list="{{ themes }}" as="t" hint-placeholder-count="2">
          <div style="flex:none;display:flex;flex-direction:column;gap:10px">
            <span style="font:800 11px/1 Unbounded,sans-serif;letter-spacing:1.5px;color:#6B5D55">{{ t.lab }}</span>
            <sc-if value="{{ isXSplash }}" hint-placeholder-val="{{ false }}"><dc-import name="XSplash" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isSlovoApp }}" hint-placeholder-val="{{ false }}"><dc-import name="SlovoApp" start="{{ cp.start }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXEntry2 }}" hint-placeholder-val="{{ false }}"><dc-import name="XEntry2" screen="{{ cp.screen }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXFeed }}" hint-placeholder-val="{{ false }}"><dc-import name="XFeed" screen="{{ cp.screen }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXSwipeV }}" hint-placeholder-val="{{ false }}"><dc-import name="XSwipeV" screen="{{ cp.screen }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXCats }}" hint-placeholder-val="{{ false }}"><dc-import name="XCats" screen="{{ cp.screen }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXGame }}" hint-placeholder-val="{{ false }}"><dc-import name="XGame" screen="{{ cp.screen }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXSaved }}" hint-placeholder-val="{{ false }}"><dc-import name="XSaved" screen="{{ cp.screen }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXBadges }}" hint-placeholder-val="{{ false }}"><dc-import name="XBadges" part="{{ cp.part }}" mode="{{ cp.mode }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXSettings }}" hint-placeholder-val="{{ false }}"><dc-import name="XSettings" screen="{{ cp.screen }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXVoice }}" hint-placeholder-val="{{ false }}"><dc-import name="XVoice" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXShare }}" hint-placeholder-val="{{ false }}"><dc-import name="XShare" kind="{{ cp.kind }}" format="{{ cp.format }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXOut }}" hint-placeholder-val="{{ false }}"><dc-import name="XOut" screen="{{ cp.screen }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXDecor }}" hint-placeholder-val="{{ false }}"><dc-import name="XDecor" season="{{ cp.season }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
            <sc-if value="{{ isXTexts }}" hint-placeholder-val="{{ false }}"><dc-import name="XTexts" screen="{{ cp.screen }}" theme="{{ t.th }}" reduce-motion="{{ rm }}" hint-size="406px,860px"></dc-import></sc-if>
          </div>
          </sc-for>
        </div>
      </sc-if>
    </main>
    <aside style="min-height:0;overflow-y:auto;padding:22px 20px 30px;border-left:1px solid rgba(20,12,10,.12);background:#F7EBDC;display:flex;flex-direction:column;gap:16px">
      <span style="font:900 16px/1.2 Unbounded,sans-serif">Що звірити в застосунку</span>
      <div style="display:flex;flex-direction:column;gap:6px">
        <sc-for list="{{ checks }}" as="k" hint-placeholder-count="5">
          <button onClick="{{ k.onClick }}" style="display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:12px;background:{{ k.bg }};text-align:left;width:100%">
            <span style="flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #140C0A;background:{{ k.box }};color:#FFF4E6;display:flex;align-items:center;justify-content:center;font:900 13px/1 Onest">{{ k.mark }}</span>
            <span style="font:500 14px/1.35 Onest;text-wrap:pretty">{{ k.t }}</span>
          </button>
        </sc-for>
      </div>
      <span style="font:800 12px/1 Unbounded,sans-serif;letter-spacing:1px;margin-top:4px">РЕЗУЛЬТАТ</span>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ stBtns }}" as="b" hint-placeholder-count="3">
          <button onClick="{{ b.onClick }}" style="min-height:48px;padding:0 14px;border-radius:14px;background:{{ b.bg }};color:{{ b.fg }};box-shadow:{{ b.sh }};transform:{{ b.tf }};display:flex;align-items:center;gap:10px;font:800 13px/1 Unbounded,sans-serif;transition:transform .08s">{{ b.t }}</button>
        </sc-for>
      </div>
      <textarea value="{{ note }}" onChange="{{ onNote }}" placeholder="Що відрізняється? Наприклад: у застосунку кнопка «Беру!» сіра, а не червона" style="min-height:110px;padding:12px;border-radius:12px;border:1px solid rgba(20,12,10,.2);background:#FFFBF5;font:400 14px/1.4 Onest;color:#140C0A;resize:vertical"></textarea>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto">
        <button onClick="{{ prev }}" style="height:56px;border-radius:14px;background:#FFFBF5;border:1px solid rgba(20,12,10,.15);box-shadow:0 4px 0 #DCC2A6;font:900 13px/1 Unbounded,sans-serif">← НАЗАД</button>
        <button onClick="{{ next }}" style="height:56px;border-radius:14px;background:#140C0A;color:#FFF4E6;box-shadow:0 4px 0 rgba(0,0,0,.35);font:900 13px/1 Unbounded,sans-serif">ДАЛІ →</button>
      </div>
      <span style="font:500 12px/1.4 Onest;color:#6B5D55;text-align:center">Клавіші ← → теж працюють. Позначки зберігаються в цьому браузері.</span>
    </aside>
  </div>
</div>
</x-dc>

const CHECKS=['Тексти дослівно як на дизайні','Розташування, відступи й розміри','Кольори, шрифти Unbounded / Onest','Світла й темна теми','Натискання, стани, анімація («Менше руху» — лише згасання)'];
const KEY='slovo-qa-v1';
class Component extends DCLogic {
  state={i:0,th:'both',todo:false,show:true,db:{},copied:false};
  componentDidMount(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');this.setState({db:d.db||{},i:Math.min(d.i||0,ST.length-1),th:d.th||'both'});}catch(e){}
    this._k=e=>{if(e.target&&/TEXTAREA|INPUT/.test(e.target.tagName))return;if(e.key==='ArrowRight')this.goStep(1);if(e.key==='ArrowLeft')this.goStep(-1);};window.addEventListener('keydown',this._k);}
  componentWillUnmount(){window.removeEventListener('keydown',this._k);clearTimeout(this._t);}
  save(p){const s={...this.state,...p};try{localStorage.setItem(KEY,JSON.stringify({db:s.db,i:s.i,th:s.th}));}catch(e){}}
  pick(i){if(i===this.state.i)return;this.setState({i,show:false});this.save({i});clearTimeout(this._t);this._t=setTimeout(()=>this.setState({show:true}),30);}
  goStep(d){const s=this.state;let i=s.i;for(let k=0;k<ST.length;k++){i=(i+d+ST.length)%ST.length;if(!s.todo||!(s.db[i]&&s.db[i].st))break;}this.pick(i);}
  upd(i,p){const db={...this.state.db,[i]:{...(this.state.db[i]||{}),...p}};this.setState({db});this.save({db});}
  renderVals(){
    const s=this.state,c=ST[s.i],ch=CH.find(x=>x.id===c.c)||{t:''},r=s.db[s.i]||{},chk=r.k||{};
    const ok=Object.values(s.db).filter(x=>x.st==='ok').length,bug=Object.values(s.db).filter(x=>x.st==='bug').length,skip=Object.values(s.db).filter(x=>x.st==='skip').length;
    const v={cur:{...c,live:c.n==='SlovoApp',kick:'КРОК '+(s.i+1)+' З '+ST.length+' · '+c.c+' '+ch.t.toUpperCase()+(c.s?' · '+c.s.toUpperCase():'')},cp:c.p,show:s.show,rm:false,isXSplash:c.n==='XSplash',isSlovoApp:c.n==='SlovoApp',isXEntry2:c.n==='XEntry2',isXFeed:c.n==='XFeed',isXSwipeV:c.n==='XSwipeV',isXCats:c.n==='XCats',isXGame:c.n==='XGame',isXSaved:c.n==='XSaved',isXBadges:c.n==='XBadges',isXSettings:c.n==='XSettings',isXVoice:c.n==='XVoice',isXShare:c.n==='XShare',isXOut:c.n==='XOut',isXDecor:c.n==='XDecor',isXTexts:c.n==='XTexts'};
    v.progT=(ok+bug+skip)+' з '+ST.length+' перевірено · '+ok+' як у дизайні · '+bug+' розбіжностей';
    v.pOk=(ok/ST.length*100).toFixed(1)+'%';v.pBug=(bug/ST.length*100).toFixed(1)+'%';
    v.themes=(s.th==='both'?['light','dark']:[s.th]).map(th=>({th,lab:th==='light'?'ДИЗАЙН · СВІТЛА':'ДИЗАЙН · ТЕМНА'}));
    v.themeOpts=[['both','Обидві теми'],['light','Світла'],['dark','Темна']].map(([k,t])=>({t,bg:s.th===k?'#FF3B2F':'rgba(255,244,230,.12)',fg:s.th===k?'#140C0A':'#FFF4E6',onClick:()=>{this.setState({th:k});this.save({th:k});}}));
    v.todoBg=s.todo?'#FFF4E6':'rgba(255,244,230,.12)';v.todoFg=s.todo?'#140C0A':'#FFF4E6';v.toggleTodo=()=>this.setState({todo:!s.todo});
    const dot=st=>st==='ok'?['#FF3B2F','0']:st==='bug'?['#140C0A','0']:st==='skip'?['#DCC2A6','0']:['transparent','2px solid rgba(20,12,10,.3)'];
    v.nav=CH.map(h=>{const items=[];ST.forEach((x,i)=>{if(x.c!==h.id)return;const st=(s.db[i]||{}).st;if(s.todo&&st&&i!==s.i)return;const [d,bd]=dot(st);const on=i===s.i;items.push({i:i+1,l:x.l,dot:d,dotBd:bd,bg:on?'#140C0A':'transparent',fg:on?'#FFF4E6':'#140C0A',onClick:()=>this.pick(i)});});
      const all=ST.filter(x=>x.c===h.id).length,done=ST.map((x,i)=>[x,i]).filter(([x,i])=>x.c===h.id&&(s.db[i]||{}).st).length;return {id:h.id,t:h.t,cnt:done+'/'+all,items};}).filter(h=>h.items.length);
    v.checks=(v.cur.live?LIVE_CHECKS:CHECKS).map((t,j)=>({t,mark:chk[j]?'✓':'',box:chk[j]?'#140C0A':'transparent',bg:chk[j]?'rgba(20,12,10,.06)':'transparent',onClick:()=>this.upd(s.i,{k:{...chk,[j]:!chk[j]}})}));
    v.stBtns=[['ok','✓  ЯК У ДИЗАЙНІ','#FF3B2F','#140C0A','#C4271D'],['bug','✕  Є РОЗБІЖНІСТЬ','#140C0A','#FFF4E6','rgba(0,0,0,.4)'],['skip','ПРОПУСТИТИ','#FFFBF5','#140C0A','#DCC2A6']].map(([k,t,bg,fg,sh])=>{const on=r.st===k;return {t,bg:on?bg:'#FFFBF5',fg:on?fg:'#140C0A',sh:on?'0 1px 0 '+sh:'0 4px 0 #DCC2A6',tf:on?'translateY(3px)':'none',onClick:()=>{this.upd(s.i,{st:on?null:k});if(!on&&k!=='bug')setTimeout(()=>this.goStep(1),250);}};});
    v.note=r.n||'';v.onNote=e=>this.upd(s.i,{n:e.target.value});
    v.prev=()=>this.goStep(-1);v.next=()=>this.goStep(1);
    v.copyT=s.copied?'СКОПІЙОВАНО ✓':'ЗВІТ ПРО РОЗБІЖНОСТІ';
    v.copyReport=()=>{const L=['SLOVO · розбіжності дизайну й застосунку',''];ST.forEach((x,i)=>{const q=s.db[i];if(q&&q.st==='bug'){const h=CH.find(y=>y.id===x.c);L.push('Крок '+(i+1)+' · '+x.c+' '+(h?h.t:'')+' · '+x.l);if(q.n)L.push('  '+q.n);}});if(L.length===2)L.push('Розбіжностей не позначено.');try{navigator.clipboard.writeText(L.join('\n'));}catch(e){}this.setState({copied:true});setTimeout(()=>this.setState({copied:false}),1600);};
    return v;
  }
}
