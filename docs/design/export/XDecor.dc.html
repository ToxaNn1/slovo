<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@keyframes dcFall{0%{opacity:0;transform:translate(0,-20px) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),300px) rotate(300deg)}}
@keyframes dcTw{50%{opacity:.2;transform:scale(.6)}}
@keyframes dcSpin{to{transform:rotate(360deg)}}
[data-rm="1"] *{animation:dcRm .3s ease 1!important}
@keyframes dcRm{from{opacity:0}}
</style>
</helmet>
<div data-rm="{{ rmAttr }}" style="display:flex;flex-direction:column;gap:10px;width:300px;font-family:'Onest',sans-serif;flex:none">
  <div style="position:relative;width:300px;height:340px;border-radius:26px;background:#FF3B2F;color:#140C0A;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 92%,0 100%)">
    <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(20,12,10,.22) 1.1px,transparent 1.6px);background-size:6px 6px"></div>
    <sc-if value="{{ isSummer }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;right:-70px;top:-70px;width:220px;height:220px;animation:dcSpin 24s linear infinite"><sc-for list="{{ rays }}" as="r" hint-placeholder-count="12"><span style="position:absolute;left:100px;top:0;width:20px;height:110px;background:#FFF4E6;clip-path:polygon(30% 0,70% 0,50% 100%);transform-origin:10px 110px;transform:rotate({{ r }})"></span></sc-for></div></sc-if>
    <sc-if value="{{ isInd }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:0;right:0;top:18px;height:26px;display:flex;gap:4px;justify-content:center"><sc-for list="{{ band }}" as="b" hint-placeholder-count="14"><span style="width:16px;height:26px;background:{{ b }};clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)"></span></sc-for></div></sc-if>
    <sc-for list="{{ parts }}" as="p" hint-placeholder-count="0"><span style="position:absolute;left:{{ p.x }};top:{{ p.y }};width:{{ p.w }};height:{{ p.h }};background:{{ p.c }};clip-path:{{ p.clip }};--dx:{{ p.dx }};animation:{{ p.anim }}"></span></sc-for>
    <span style="position:absolute;left:20px;top:58px;font:800 11px/1 Unbounded,sans-serif;letter-spacing:2px">DECOR</span>
    <span style="position:absolute;left:18px;top:78px;font:900 {{ nS }}/1.05 Unbounded,sans-serif;letter-spacing:-1px;width:260px">{{ name }}</span>
    <div style="position:absolute;left:30px;bottom:44px"><dc-import name="Rupor" state="{{ m }}" on-red="{{ true }}" size="{{ 190 }}" decor="{{ season }}" hint-size="190px,143px"></dc-import></div>
  </div>
  <span style="font:500 13px/1.4 Onest;color:#6B5D55">{{ note }}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:400},&quot;season&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;spring&quot;,&quot;summer&quot;,&quot;newyear&quot;,&quot;christmas&quot;,&quot;independence&quot;],&quot;default&quot;:&quot;spring&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;reduceMotion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const S={
 spring:{name:'Весна',m:'happy',note:'Аксесуар: квітка на капелюсі. Шар: пелюстки з розтруба.'},
 summer:{name:'Літо',m:'wait',note:'Аксесуар: клиноподібні окуляри. Шар: сонце-клин у куті.'},
 newyear:{name:'Новий рік',m:'celebrate',note:'Аксесуар: святковий ковпак. Шар: конфеті-клини.'},
 christmas:{name:'Різдво',m:'shout',note:'Аксесуар: колядницька зірка. Шар: мерехтливі зірки.'},
 independence:{name:'День Незалежності',m:'shout',note:'Аксесуар: вишита стрічка. Шар: орнамент-ромби вгорі.'}};
class Component extends DCLogic {
  renderVals(){
    const season=this.props.season||'spring',d=S[season];
    const rnd=i=>((i*73)%100)/100;
    let parts=[];
    if(season==='spring') parts=Array.from({length:9},(_,i)=>({x:(170+rnd(i)*110)+'px',y:(150+rnd(i+3)*40)+'px',w:'10px',h:'10px',c:i%3?'#FFF4E6':'#140C0A',clip:'ellipse(50% 30% at 50% 50%)',dx:(-160+rnd(i+5)*80)+'px',anim:'dcFall '+(2.6+rnd(i)*1.4)+'s '+(i*.35)+'s linear infinite'}));
    if(season==='newyear') parts=Array.from({length:14},(_,i)=>({x:(rnd(i)*280)+'px',y:(-10+rnd(i+2)*30)+'px',w:'9px',h:'14px',c:i%2?'#FFF4E6':'#140C0A',clip:'polygon(0 0,100% 25%,100% 100%,0 75%)',dx:(-30+rnd(i+7)*60)+'px',anim:'dcFall '+(2.2+rnd(i)*1.6)+'s '+(i*.22)+'s linear infinite'}));
    if(season==='christmas') parts=Array.from({length:10},(_,i)=>({x:(140+rnd(i)*140)+'px',y:(20+rnd(i+4)*200)+'px',w:'12px',h:'12px',c:'#FFF4E6',clip:'polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)',dx:'0px',anim:'dcTw '+(1.6+rnd(i))+'s '+(i*.2)+'s ease-in-out infinite'}));
    return {...d,nS:season==='independence'?'22px':'30px',season,parts,rmAttr:this.props.reduceMotion?'1':'0',isSummer:season==='summer',isInd:season==='independence',
      rays:Array.from({length:12},(_,i)=>(i*30)+'deg'),band:Array.from({length:14},(_,i)=>i%2?'#140C0A':'#FFF4E6')};
  }
}
</script>
</body>
</html>
