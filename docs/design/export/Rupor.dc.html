<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
@keyframes rpBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes rpBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.04,.97)}}
@keyframes rpShout{from{transform:scale(1) rotate(0)}to{transform:scale(1.07) rotate(-3deg)}}
@keyframes rpHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px) rotate(-4deg)}}
@keyframes rpPop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes rpSquish{0%{transform:scale(1)}40%{transform:scale(.86,1.08)}100%{transform:scale(.94,1)}}
@keyframes rpSway{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
@keyframes rpRoll{from{transform:translateX(-360px) rotate(-560deg)}}
@keyframes rpRay{50%{opacity:.25}}
@keyframes rpZ{0%{opacity:0;transform:translate(0,6px)}50%{opacity:1}100%{opacity:0;transform:translate(6px,-8px)}}
</style></helmet>
<div style="width:{{ w }};height:{{ h }};animation:{{ outerAnim }};flex:none">
  <div style="width:100%;height:100%;transform-origin:30% 60%;animation:{{ innerAnim }}">{{ art }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:180},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;wait&quot;,&quot;sleep&quot;,&quot;shout&quot;,&quot;happy&quot;,&quot;surprised&quot;,&quot;cringe&quot;,&quot;sad&quot;,&quot;celebrate&quot;,&quot;mourn&quot;],&quot;default&quot;:&quot;wait&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:120,&quot;min&quot;:40,&quot;max&quot;:400,&quot;tsType&quot;:&quot;number&quot;},&quot;decor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;autumn&quot;,&quot;winter&quot;,&quot;spring&quot;,&quot;summer&quot;,&quot;newyear&quot;,&quot;christmas&quot;,&quot;independence&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;roll&quot;,&quot;none&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const R='#FF3B2F',K='#140C0A',C='#FFF4E6';
function svg(st,decor,onRed){
  const ink=onRed?K:'var(--ink,#140C0A)';
  const mourn=st==='mourn';
  const body=mourn?'var(--mute,#6B5D55)':onRed?C:R;
  const rot=st==='sad'?14:mourn?26:0;
  const S='stroke="'+K+'" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  const whites=(r,px,py)=>'<circle cx="55" cy="54" r="'+r+'" fill="'+C+'"/><circle cx="77" cy="54" r="'+r+'" fill="'+C+'"/><circle cx="'+(55+px)+'" cy="'+(54+py)+'" r="'+(r*.46)+'" fill="'+K+'"/><circle cx="'+(77+px)+'" cy="'+(54+py)+'" r="'+(r*.46)+'" fill="'+K+'"/>';
  let eyes;
  switch(st){
    case 'sleep': eyes='<path d="M48 54 Q55 60 62 54 M70 54 Q77 60 84 54" '+S+'/>';break;
    case 'shout': eyes='<path d="M49 47 L60 54 L49 61 M84 47 L73 54 L84 61" '+S+'/>';break;
    case 'happy': case 'celebrate': eyes='<path d="M48 57 Q55 45 62 57 M70 57 Q77 45 84 57" '+S+'/>';break;
    case 'surprised': eyes=whites(9,0,0);break;
    case 'cringe': eyes='<path d="M48 50 L59 55 L48 59 M84 50 L73 55 L84 59" '+S+'/><path d="M46 43 L58 47 M86 43 L74 47" '+S+'/>';break;
    case 'sad': eyes=whites(6.5,0,3)+'<path d="M46 46 L59 42 M86 46 L73 42" '+S+'/>';break;
    case 'mourn': eyes='<path d="M48 55 L62 55 M70 55 L84 55" stroke="'+C+'" stroke-width="4" stroke-linecap="round"/>';break;
    default: eyes=whites(7,2.5,0);
  }
  const capY=st==='cringe'?35:31;
  let head='';
  if(!mourn){
    head= decor==='winter'
      ? '<g transform="translate(60 '+capY+') rotate(-20.7)"><path d="M-20 0 Q-18 -25 -1 -23 Q16 -21 14 0 Z" fill="'+C+'" stroke="'+K+'" stroke-width="2.5"/><rect x="-22" y="-6" width="38" height="8" fill="'+K+'"/><circle cx="-2" cy="-25" r="5.5" fill="'+C+'" stroke="'+K+'" stroke-width="2.5"/></g>'
      : '<g transform="translate(60 '+capY+') rotate(-20.7)"><path d="M-20 0 Q-20 -16 -4 -16 Q12 -16 12 0 Z" fill="'+ink+'"/><polygon points="8,-4 31,-1 31,2.5 8,2.5" fill="'+ink+'"/><circle cx="-4" cy="-16" r="3.2" fill="'+R+'"/></g>';
  }
  if(!mourn&&decor==='newyear') head='<g transform="translate(58 '+capY+') rotate(-20.7)"><polygon points="-18,0 14,0 -3,-40" fill="'+C+'" stroke="'+K+'" stroke-width="2.5" stroke-linejoin="round"/><polygon points="-14,-9 10,-9 7,-16 -11,-16" fill="'+R+'"/><polygon points="-8,-24 4,-24 1,-31 -5,-31" fill="'+R+'"/><circle cx="-3" cy="-42" r="5" fill="'+R+'" stroke="'+K+'" stroke-width="2.5"/></g>';
  if(!mourn&&decor==='spring') head+='<g transform="translate(46 15)"><circle cx="0" cy="-6" r="4.5" fill="'+C+'" stroke="'+K+'" stroke-width="2"/><circle cx="6" cy="-1" r="4.5" fill="'+C+'" stroke="'+K+'" stroke-width="2"/><circle cx="3" cy="6" r="4.5" fill="'+C+'" stroke="'+K+'" stroke-width="2"/><circle cx="-4" cy="5" r="4.5" fill="'+C+'" stroke="'+K+'" stroke-width="2"/><circle cx="-6" cy="-2" r="4.5" fill="'+C+'" stroke="'+K+'" stroke-width="2"/><circle r="3.5" fill="'+R+'" stroke="'+K+'" stroke-width="1.5"/></g>';
  const shades=(!mourn&&decor==='summer'&&st!=='sleep')?'<polygon points="45,47 64,44 63,60 46,61" fill="'+K+'"/><polygon points="68,43 88,40 87,57 69,59" fill="'+K+'"/><polygon points="63,47 69,46 69,49 63,50" fill="'+K+'"/><polygon points="49,49 56,48 50,53" fill="'+C+'" opacity=".5"/>':'';
  const star=(!mourn&&decor==='christmas')?'<g><line x1="14" y1="100" x2="6" y2="28" stroke="'+K+'" stroke-width="3.5" stroke-linecap="round"/><g transform="translate(5 20)"><polygon points="0,-17 4,-6 15,-12 8,-2 17,4 5,5 4,17 -2,7 -12,13 -7,2 -17,-4 -6,-5 -8,-15 -1,-7" fill="'+C+'" stroke="'+K+'" stroke-width="2.2" stroke-linejoin="round"/><circle r="4.5" fill="'+R+'" stroke="'+K+'" stroke-width="1.8"/></g></g>':'';
  const vysh=(!mourn&&decor==='independence')?'<polygon points="33,39 41,36 41,76 33,73" fill="'+C+'" stroke="'+K+'" stroke-width="2"/><polygon points="37,42 40,46 37,50 34,46" fill="'+K+'"/><polygon points="37,52 40,56 37,60 34,56" fill="'+R+'"/><polygon points="37,62 40,66 37,70 34,66" fill="'+K+'"/>':'';
  const scarf=(!mourn&&decor==='autumn')?'<polygon points="26,41 39,37 39,73 26,77" fill="'+C+'" stroke="'+K+'" stroke-width="2.5"/><polygon points="30,72 39,71 37,98 28,96" fill="'+C+'" stroke="'+K+'" stroke-width="2.5"/><line x1="26" y1="53" x2="39" y2="50" stroke="'+K+'" stroke-width="2.5"/><line x1="26" y1="64" x2="39" y2="61" stroke="'+K+'" stroke-width="2.5"/>':'';
  const scarfW=(!mourn&&decor==='winter')?'<polygon points="26,41 39,37 39,73 26,77" fill="'+K+'"/><polygon points="30,72 39,71 37,98 28,96" fill="'+K+'"/>':'';
  const rays=(st==='shout'||st==='celebrate')?'<g style="animation:rpRay .45s steps(2) infinite" fill="'+(onRed?K:R)+'"><polygon points="122,30 139,15 142,23"/><polygon points="124,56 145,52 145,61"/><polygon points="122,82 142,97 139,104"/></g>':'';
  const conf=st==='celebrate'?'<polygon points="12,14 22,9 20,21" fill="'+R+'"/><polygon points="70,-2 78,2 70,8" fill="'+ink+'"/><polygon points="132,-4 142,0 136,8" fill="'+ink+'"/><polygon points="4,96 14,92 12,104" fill="'+ink+'"/><polygon points="96,112 106,108 104,118" fill="'+R+'"/>':'';
  const z=st==='sleep'?'<text x="114" y="28" font-family="Unbounded,sans-serif" font-weight="800" font-size="17" style="fill:'+ink+';animation:rpZ 2.4s infinite">z</text><text x="128" y="12" font-family="Unbounded,sans-serif" font-weight="800" font-size="12" style="fill:'+ink+';animation:rpZ 2.4s .8s infinite">z</text>':'';
  const shine=mourn?'':'<polygon points="38,45 98,22 98,28 38,50" fill="'+C+'" opacity=".22"/>';
  const groundCap=mourn?'<g transform="translate(118 104)"><path d="M-16 0 Q-16 -12 -3 -12 Q10 -12 10 0 Z" style="fill:'+ink+'"/><polygon points="7,-3 22,-1 22,1.5 7,1.5" style="fill:'+ink+'"/></g>':'';
  return '<svg viewBox="0 0 150 112" width="100%" height="100%" style="overflow:visible;display:block">'+conf+'<g transform="rotate('+rot+' 30 56)"><polygon points="8,44 30,46 30,66 8,68" style="fill:'+ink+'"/><polygon points="30,40 104,12 104,100 30,72" style="fill:'+body+'"/>'+shine+'<polygon points="104,12 114,6 114,106 104,100" style="fill:'+ink+'"/>'+scarfW+scarf+vysh+eyes+shades+head+rays+'</g>'+star+groundCap+z+'</svg>';
}
const IN={wait:'rpBob 2.4s ease-in-out infinite',sleep:'rpBreath 3s ease-in-out infinite',shout:'rpShout .32s ease-in-out infinite alternate',happy:'rpHop .8s ease infinite',celebrate:'rpHop .55s ease infinite',surprised:'rpPop .45s ease both',cringe:'rpSquish .5s ease both',sad:'rpSway 3.2s ease-in-out infinite',mourn:'none'};
class Component extends DCLogic {
  renderVals(){
    const st=this.props.state||'wait';
    const size=this.props.size||120;
    const decor=this.props.decor||'none';
    const motion=this.props.motion||'auto';
    return {
      w:size+'px',h:Math.round(size*.75)+'px',
      outerAnim:motion==='roll'?'rpRoll .6s cubic-bezier(.25,.9,.3,1.1) both':'none',
      innerAnim:motion==='none'?'none':(IN[st]||'none'),
      art:React.createElement('div',{style:{width:'100%',height:'100%'},dangerouslySetInnerHTML:{__html:svg(st,decor,!!this.props.onRed)}})
    };
  }
}
</script>
</body>
</html>
