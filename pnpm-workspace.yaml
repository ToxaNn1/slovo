packages:
  - apps/*
  - packages/*
  - tools/*
  - editions/*

# Dependencies allowed to run install scripts. esbuild (used by tsx) ships its
# binary in a platform package, so its postinstall check isn't needed.
# @sentry/cli (via @sentry/react-native) downloads its binary to upload source
# maps and debug files, which the app's builds don't do.
allowBuilds:
  esbuild: false
  '@sentry/cli': false

# Peers that pnpm installs on its own, pinned to the versions Expo SDK 57
# expects (see expo/bundledNativeModules.json).
overrides:
  '@react-native/metro-config': 0.86.3
  react-dom: 19.2.3
  # drizzle-orm's optional expo-sqlite peer: only the backend uses drizzle,
  # but pnpm fills the peer from the app's expo-sqlite and the backend image
  # then carries expo and react-native.
  'drizzle-orm>expo-sqlite': '-'
  # The Apple targets plugin's Xcode library pins an old plist reader whose
  # @xmldom/xmldom has high advisories; Expo's own reader has the same API
  # and a patched xmldom.
  '@bacons/xcode>@expo/plist': ^0.8.1
  # zod 4 before 4.6.6 can exhaust memory (GHSA-mrhx-c7xc-m3w5); tools that
  # take any zod 4 (knip, the React hooks lint plugin) get the patched one.
  'zod@>=4 <4.6.6': ^4.6.7
  # node-forge <=1.4.0 and decode-uri-component <=0.5.0 carry high advisories
  # (GHSA-7wch-p9px-956x and four more; GHSA-qr28-fpjm-wq7f); both have patched releases.
  node-forge@<=1.4.0: ^1.4.1
  decode-uri-component@<=0.5.0: ^0.5.1

# High advisories with no patched release yet, reachable only through
# build-time tooling (Expo CLI code signing, Metro's file watcher) and never
# shipped in the app. Last reviewed 2026-10-11; revisit by 2027-01-11, or
# sooner when either package ships a fix: drop the entry and let `pnpm audit`
# run unfiltered. Surfacing these on GitHub needs Dependabot alerts, a
# repository setting that is not part of the repo.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv # node-forge, via @expo/cli; reviewed 2026-10-11
    - GHSA-vfj7-8cjw-p6xm # braces, via metro; reviewed 2026-10-11
    # zod 3 has no patched release; SLOVO's own zod is 4.6.7+, so this only
    # covers zod 3.25 inside @expo/cli (build-time). Reviewed 2026-10-24.
    - GHSA-mrhx-c7xc-m3w5 # zod 3, via @expo/cli; reviewed 2026-10-24
