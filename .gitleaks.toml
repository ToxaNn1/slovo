# Gitleaks config for the "Secret scanning" job: the default rules, plus the
# values that are public by design. CI runs gitleaks 8.24, which reads the
# single [allowlist] table, not [[allowlists]].
[extend]
useDefault = true

[allowlist]
description = "Public by design: the Cloudflare Web Analytics beacon token, every visitor's page carries it (ADR 0147); Sync record keys such as favorites.w_a1 in tests"
regexes = ['''16c43b5d7a574645a3632769bc7e0084''', '''^[a-zA-Z]+\.([a-z0-9]+\.)?w_[a-z0-9]+$''']
