# Hiding from the Mix: hide the Category of the Word card on screen, or
# Corrections from a Correction card, see another card take its place under
# the undo toast, and undo, which brings the card back. A subflow of
# `smoke.yaml`; run it from there. It expects every Category and Corrections
# in the Mix, as it leaves them.
appId: ${APP_ID || 'app.slovo.uk'}
---
- tapOn:
    id: tab-home
# Keep what VoiceOver reads for the card's title, to tell the card apart later.
- copyTextFrom:
    id: word-lemma|correction-standard
- evalScript: ${output.hiddenTitle = maestro.copiedText}
# The hide button sits under the card, which may be taller than the screen.
- scrollUntilVisible:
    element:
      id: hide-button
# Then off the tab bar, which covers the bottom of a card that barely fits.
- swipe:
    start: 50%, 60%
    end: 50%, 48%
    duration: 800
- waitForAnimationToEnd
- tapOn:
    id: hide-button
# A Word card offers its Category, a Correction card Corrections as a whole.
- assertVisible: Не показувати цей запис
- assertVisible: Не показувати (категорію «.+»|Виправлення)
- takeScreenshot: hiding-mix-choice
- tapOn: Не показувати (категорію «.+»|Виправлення)
# The toast stays 4 s, so only quick checks come before its undo: the toast
# names what left the Mix, and another card took the hidden one's place.
- assertVisible:
    id: undo-toast-message
    text: Категорію «.+» приховано|Виправлення приховано
- assertVisible:
    id: word-lemma|correction-standard
    text: (?!\Q${output.hiddenTitle}\E$).+
- tapOn:
    id: undo-toast-undo
    text: Скасувати
- assertNotVisible:
    id: undo-toast
# Undo puts the Category or Corrections back, and the hidden card on screen.
- assertVisible:
    id: word-lemma|correction-standard
    text: \Q${output.hiddenTitle}\E
- takeScreenshot: hiding-mix-undone
