# Opening an Entry from the widget: its link opens the Entry screen with the
# full card and its action row, back lands on the Feed, and the Entry is at
# the top of History. A link to an Entry the Language Pack doesn't have opens
# the Feed. A subflow of `smoke.yaml`; run it from there. It clears the app's
# state.
appId: ${APP_ID || 'app.slovo.uk'}
---
# A fresh install, so the Entry is not Seen yet.
- runFlow:
    file: ../fresh-install.yaml
# The link the widget carries, for «приймати до уваги» → «брати до уваги», a
# Correction of the Ukrainian Edition: the widget opens Corrections too.
- openLink: ${(SCHEME || 'slovo-uk') + '://entry/c_77szl9?from=widget'}
# A simulator asks once whether the link may open the app.
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- assertVisible:
    id: entry-screen
- assertVisible:
    id: correction-standard
- scrollUntilVisible:
    element:
      id: action-row
- takeScreenshot: open-from-widget-entry
- tapOn:
    id: entry-screen-back
- assertVisible:
    id: home
# The Correction was Seen as it opened, so it is the newest row of History.
- tapOn:
    id: tab-saved
- tapOn:
    id: saved-history
- assertVisible:
    id: history-row-c_77szl9-open
- assertNotVisible:
    id: history-row-.*-open
    above:
      id: history-row-c_77szl9-open
- takeScreenshot: open-from-widget-history
- tapOn:
    id: history-back
# An Entry the widget last knew that the Language Pack no longer has opens the
# Feed. It opens from the Saved tab, so the Feed shows only by that fallback.
- assertVisible:
    id: saved-history
- openLink: ${(SCHEME || 'slovo-uk') + '://entry/c_000000?from=widget'}
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- assertVisible:
    id: home
- assertNotVisible:
    id: entry-screen
