# Settings › SLOVO ID: a reader signs in with the Sign-in code from the email
# and signs out. It needs the backend (with Docker's Postgres and Mailpit) on
# the address Metro was started with, `EXPO_PUBLIC_SLOVO_API_URL`, and reads
# the code from Mailpit's HTTP API, `MAILPIT_URL` (http://localhost:8025 by
# default). Until the next native build the Session is kept in memory, so the
# reader is signed out after a restart. It leaves the reader signed out.
# A subflow of `smoke.yaml`; run it from there.
appId: ${APP_ID || 'app.slovo.uk'}
---
- runFlow:
    file: ../open-settings-row.yaml
    env:
      ROW: settings-row-account
# Signed in from an earlier run of the same app: sign out first.
- runFlow:
    when:
      visible:
        id: settings-row-account
        text: 'SLOVO ID, .*@.*'
    commands:
      - tapOn:
          id: settings-row-account
      - tapOn:
          id: account-sign-out
      - tapOn:
          id: account-back
- assertVisible:
    id: settings-row-account
    text: 'SLOVO ID, Увійти'
- tapOn:
    id: settings-row-account
- assertVisible:
    id: account
- runFlow: ../sign-in.yaml
- assertVisible:
    id: account-sign-out-everywhere
- assertVisible:
    id: account-delete
# «Видалити SLOVO ID» asks first; cancelling keeps the Account.
- tapOn:
    id: account-delete
- assertVisible: Видалити SLOVO ID?
- takeScreenshot: account-delete-confirm
- tapOn:
    id: account-delete-dialog-cancel
- assertVisible:
    id: account-delete
- tapOn:
    id: account-back
- assertVisible:
    id: settings-row-account
    text: ${'SLOVO ID, ' + output.email}
# «Вийти» signs this device out at once.
- tapOn:
    id: settings-row-account
- tapOn:
    id: account-sign-out
- assertVisible:
    id: account-email
- assertVisible:
    id: account-send-code
- tapOn:
    id: account-back
- assertVisible:
    id: settings-row-account
    text: 'SLOVO ID, Увійти'
