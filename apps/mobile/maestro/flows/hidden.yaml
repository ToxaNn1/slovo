# The Hidden screen: hide two cards, find them under Settings › Приховані
# записи, bring the older one back with «Повернути» and undo that from the
# toast, which puts it back at its old place, below the newer one. A subflow of
# `smoke.yaml`; run it from there. It starts by bringing back the Hidden
# Entries it finds, and leaves none.
appId: ${APP_ID || 'app.slovo.uk'}
---
# Bring every Hidden Entry back, so the counts below are the flow's own.
- runFlow:
    file: ../open-settings-row.yaml
    env:
      ROW: settings-row-hidden
- tapOn:
    id: settings-row-hidden
- assertVisible:
    id: hidden
- repeat:
    while:
      visible:
        id: hidden-entry-.*-restore
    times: 50
    commands:
      - tapOn:
          id: hidden-entry-.*-restore
      - waitForAnimationToEnd
- tapOn:
    id: hidden-back
- tapOn:
    id: tab-home
# Keep the card's title, to find the hidden Entry later: VoiceOver reads a Word
# card's Lemma first, then its Stress; a Correction card's standard form comes
# after its label, which is cut off here.
- copyTextFrom:
    id: word-lemma|correction-standard
- evalScript: ${output.olderTitle = maestro.copiedText.split(',')[0].split(':').pop().trim()}
# The hide button sits under the card, which may be taller than the screen, and
# off the tab bar (see hiding.yaml).
- scrollUntilVisible:
    element:
      id: hide-button
- swipe:
    start: 50%, 60%
    end: 50%, 48%
    duration: 800
- waitForAnimationToEnd
- tapOn:
    id: hide-button
- tapOn: Не показувати цей запис
- assertVisible:
    id: undo-toast-message
    text: «.+» приховано
# The next card takes its place: hide it too, so it is the newer Hidden Entry.
- waitForAnimationToEnd
- copyTextFrom:
    id: word-lemma|correction-standard
- evalScript: ${output.newerTitle = maestro.copiedText.split(',')[0].split(':').pop().trim()}
- scrollUntilVisible:
    element:
      id: hide-button
- swipe:
    start: 50%, 60%
    end: 50%, 48%
    duration: 800
- waitForAnimationToEnd
- tapOn:
    id: hide-button
- tapOn: Не показувати цей запис
- assertVisible:
    id: undo-toast-message
    text: «.+» приховано
- runFlow:
    file: ../open-settings-row.yaml
    env:
      ROW: settings-row-hidden
- assertVisible:
    id: settings-row-hidden
    text: Приховані записи, 2 записи
- tapOn:
    id: settings-row-hidden
- assertVisible:
    id: hidden
- assertVisible: Вони більше не трапляться вам ніде, доки ви їх не повернете.
- assertVisible: ЗАПИСИ
- assertVisible:
    id: hidden-entries
# A row is read as its title, then its kind and labels.
- assertVisible:
    text: \Q${output.olderTitle}\E, (слово|виправлення).*
- assertVisible:
    text: \Q${output.newerTitle}\E, (слово|виправлення).*
- takeScreenshot: hidden-entries
# The newer one is first; the second «Повернути» brings the older one back,
# under a toast. The toast stays 4 s, so only a quick check comes before its
# undo.
- tapOn:
    id: hidden-entry-.*-restore
    index: 1
- assertVisible:
    id: undo-toast-message
    text: «\Q${output.olderTitle}\E» знову у Стрічці
- takeScreenshot: hidden-restored
# Undo hides it again with the time it had, so it is below the newer one: the
# first «Повернути» brings the newer one back, not the older one, and the
# newer one leaves the list.
- tapOn:
    id: undo-toast-undo
    text: Скасувати
- waitForAnimationToEnd
- assertVisible:
    text: \Q${output.olderTitle}\E, (слово|виправлення).*
- tapOn:
    id: hidden-entry-.*-restore
- assertVisible:
    id: undo-toast-message
    text: «\Q${output.newerTitle}\E» знову у Стрічці
- assertNotVisible:
    text: \Q${output.newerTitle}\E, (слово|виправлення).*
# Bring the older one back for good, so the flows after this one see the Feed
# as it was.
- tapOn:
    id: hidden-entry-.*-restore
- assertVisible:
    id: hidden-empty
    text: Прихованих записів немає.
- tapOn:
    id: hidden-back
- assertVisible:
    id: settings-row-hidden
    text: Приховані записи, 0 записів
