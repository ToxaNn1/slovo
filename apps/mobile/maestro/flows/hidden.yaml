# The Hidden screen: hide the card on screen, find it under Settings ›
# Приховані записи, bring it back with «Повернути» and undo that from the
# toast. A subflow of `smoke.yaml`; run it from there. It expects no Hidden
# Entry, as it leaves none.
appId: ${APP_ID || 'app.slovo.uk'}
---
- tapOn:
    id: tab-home
# Keep the card's title (VoiceOver reads the Lemma first, then its Stress), to
# find the hidden Entry later.
- copyTextFrom:
    id: word-lemma|correction-standard
- evalScript: ${output.hiddenTitle = maestro.copiedText.split(',')[0]}
# The hide button sits under the card, which may be taller than the screen, and
# off the tab bar (see hiding.yaml).
- scrollUntilVisible:
    element:
      id: hide-button
- swipe:
    start: 50%, 60%
    end: 50%, 48%
    duration: 800
- waitForAnimationToEnd
- tapOn:
    id: hide-button
- tapOn: Не показувати цей запис
- assertVisible:
    id: undo-toast-message
    text: «.+» приховано
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: settings-row-hidden
    # Off the tab bar, which covers the bottom of the list at the largest font size.
    centerElement: true
    visibilityPercentage: 50
- assertVisible:
    id: settings-row-hidden
    text: Приховані записи, 1 запис
- tapOn:
    id: settings-row-hidden
- assertVisible:
    id: hidden
- assertVisible: Вони більше не трапляться вам ніде, доки ви їх не повернете.
- assertVisible: ЗАПИСИ
- assertVisible:
    id: hidden-entries
# The row is read as its title, then its kind and labels.
- assertVisible:
    text: \Q${output.hiddenTitle}\E, (слово|виправлення).*
- takeScreenshot: hidden-entries
# «Повернути» brings the Entry back: it leaves the list under a toast.
- tapOn:
    id: hidden-entry-.*-restore
- assertVisible:
    id: undo-toast-message
    text: «.+» знову у Стрічці
- assertVisible:
    id: hidden-empty
    text: Прихованих записів немає.
- takeScreenshot: hidden-restored
# Undo hides it again.
- tapOn:
    id: undo-toast-undo
    text: Скасувати
- assertVisible:
    id: hidden-entries
- assertNotVisible:
    id: hidden-empty
# Bring it back for good, so the flows after this one see the Feed as it was.
- tapOn:
    id: hidden-entry-.*-restore
- assertVisible:
    id: hidden-empty
- tapOn:
    id: hidden-back
- assertVisible:
    id: settings-row-hidden
    text: Приховані записи, 0 записів
