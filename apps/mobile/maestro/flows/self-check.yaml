# Self-check («Перевір себе») is switched off in the UA Edition (Feature Switch
# `selfCheck`), so a Feed card shows everything at once: its meaning is on
# screen with no reveal button, and its Knowledge Mark buttons work right away,
# on this card and on the next.
# A subflow of `smoke.yaml`; run it from there. It leaves the Feed on screen.
appId: ${APP_ID || 'app.slovo.uk'}
---
# The card on screen shows its meaning: a Word, a Correction or an Idiom.
- tapOn:
    id: tab-home
- scrollUntilVisible:
    element:
      id: word-definition|correction-standard|idiom-definition
- assertNotVisible:
    id: (word|correction|idiom|tip|synonymRow)-reveal
- takeScreenshot: self-check-off-shown
# The buttons sit under the card, which may be taller than the screen.
- scrollUntilVisible:
    element:
      id: knowledge-known
# Then off the tab bar, which covers the bottom of a card that barely fits: a
# short slow drag scrolls the card further, or to its end, and is too short
# and slow to turn the page.
- swipe:
    start: 50%, 60%
    end: 50%, 48%
    duration: 800
- waitForAnimationToEnd
- assertVisible:
    id: knowledge-known
    enabled: true
- assertVisible:
    id: knowledge-unknown
    enabled: true
# The next card shows everything too.
- swipe:
    start: 50%, 70%
    end: 50%, 20%
    duration: 300
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: word-definition|correction-standard|idiom-definition
- assertNotVisible:
    id: (word|correction|idiom|tip|synonymRow)-reveal
- scrollUntilVisible:
    element:
      id: knowledge-known
- swipe:
    start: 50%, 60%
    end: 50%, 48%
    duration: 800
- waitForAnimationToEnd
- assertVisible:
    id: knowledge-known
    enabled: true
- assertVisible:
    id: knowledge-unknown
    enabled: true
- takeScreenshot: self-check-off-next
