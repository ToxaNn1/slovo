# The Stats pill: a fresh install shows a Streak of 1, as VoiceOver reads it.
# A subflow of `smoke.yaml`; run it from there. It clears the app's state.
appId: ${APP_ID || 'app.slovo.uk'}
---
# A fresh install: nothing kept from an earlier run, so today is the first Active Day.
- runFlow:
    file: ../fresh-install.yaml
- assertVisible:
    id: stats-pill
    text: 'Статистика: серія 1 день'
