# Hiding: hide the card on screen from its action row, see the next card take
# its place under the undo toast, and undo, which brings the card back. A
# subflow of `smoke.yaml`; run it from there. It expects no Hidden Entry, as it
# leaves none.
appId: ${APP_ID || 'app.slovo.uk'}
---
- tapOn:
    id: tab-home
# Keep what VoiceOver reads for the card's title, to tell the card apart later.
- copyTextFrom:
    id: word-lemma|correction-standard
- evalScript: ${output.hiddenTitle = maestro.copiedText}
# The hide button sits under the card, which may be taller than the screen.
- scrollUntilVisible:
    element:
      id: hide-button
# Then off the tab bar, which covers the bottom of a card that barely fits: a
# short slow drag scrolls the card further, or to its end, and is too short
# and slow to turn the page.
- swipe:
    start: 50%, 60%
    end: 50%, 48%
    duration: 800
# A tap while the card still glides only stops it.
- waitForAnimationToEnd
- assertVisible:
    id: hide-button
    text: Не показувати
- tapOn:
    id: hide-button
# The hide choice is the system action sheet; cancel leaves the card.
- assertVisible: Не показувати цей запис
- takeScreenshot: hiding-choice
- tapOn: Скасувати
- assertNotVisible: Не показувати цей запис
- assertNotVisible:
    id: undo-toast
- tapOn:
    id: hide-button
- tapOn: Не показувати цей запис
# The toast stays 4 s, so only quick checks come before its undo: the toast
# names the hidden Entry, and another card took its place.
- assertVisible:
    id: undo-toast-message
    text: «.+» приховано
- assertVisible:
    id: word-lemma|correction-standard
    text: (?!\Q${output.hiddenTitle}\E$).+
- tapOn:
    id: undo-toast-undo
    text: Скасувати
- assertNotVisible:
    id: undo-toast
# Undo puts the hidden card back on screen, scrolled to its top.
- assertVisible:
    id: word-lemma|correction-standard
    text: \Q${output.hiddenTitle}\E
- takeScreenshot: hiding-undone
