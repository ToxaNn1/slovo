# Opening a Word from a notification: its link opens the Entry screen with the
# full card and its action row, and History lists the Word. A subflow of
# `smoke.yaml`; run it from there. It clears the app's state.
appId: ${APP_ID || 'app.slovo.uk'}
---
# A fresh install, so the Word is not Seen yet and History starts empty.
- runFlow:
    file: ../fresh-install.yaml
# The link a notification carries, for кракелюр, a Word of the Ukrainian Edition.
- openLink: ${(SCHEME || 'slovo-uk') + '://entry/w_00g2ap?from=notification'}
# A simulator asks once whether the link may open the app.
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- assertVisible:
    id: entry-screen
- assertVisible:
    id: word-card
- assertVisible:
    id: word-lemma
- scrollUntilVisible:
    element:
      id: action-row
- takeScreenshot: open-from-notification-entry
# The Word was Seen as it opened, so History lists it.
- tapOn:
    id: entry-screen-back
- assertVisible:
    id: home
- tapOn:
    id: tab-saved
- tapOn:
    id: saved-history
- assertVisible:
    id: history-row-w_00g2ap-open
- takeScreenshot: open-from-notification-history
- tapOn:
    id: history-back
- tapOn:
    id: tab-home
- assertVisible:
    id: home
