# The Saved tab that replaced its placeholder, and back to the Feed. The Game
# tab has its own flow, `game.yaml`.
# A subflow of `smoke.yaml`; run it from there.
appId: ${APP_ID || 'app.slovo.uk'}
---
- tapOn:
    id: tab-saved
- assertVisible:
    id: saved
- tapOn:
    id: tab-home
- assertVisible:
    id: word-lemma
