# Favorites: heart a card in the Feed, see it counted on the Saved tab and
# listed in Favorites, open it, and take it out from its Entry screen.
# A subflow of `smoke.yaml`; run it from there. It starts by taking out the
# Favorites it finds, and leaves none.
appId: ${APP_ID || 'app.slovo.uk'}
---
# Take every Entry out of Favorites, so the counts below are the flow's own.
- tapOn:
    id: tab-saved
- tapOn:
    id: saved-favorites
- assertVisible:
    id: favorites
- repeat:
    while:
      visible:
        id: entry-row-.*-open
    times: 50
    commands:
      - tapOn:
          id: entry-row-.*-open
      - scrollUntilVisible:
          element:
            id: favorite-button
      - swipe:
          start: 50%, 60%
          end: 50%, 48%
          duration: 800
      - waitForAnimationToEnd
      - tapOn:
          id: favorite-button
          text: Прибрати з Улюбленого
      - tapOn:
          id: entry-screen-back
- tapOn:
    id: favorites-back
- tapOn:
    id: tab-home
# The heart sits under the card, which may be taller than the screen.
- scrollUntilVisible:
    element:
      id: favorite-button
# Then off the tab bar, which covers the bottom of a card that barely fits: a
# short slow drag scrolls the card further, or to its end, and is too short
# and slow to turn the page.
- swipe:
    start: 50%, 60%
    end: 50%, 48%
    duration: 800
# A tap while the card still glides only stops it.
- waitForAnimationToEnd
- assertVisible:
    id: favorite-button
    text: Додати в Улюблене
- tapOn:
    id: favorite-button
- assertVisible:
    id: favorite-button
    text: Прибрати з Улюбленого
- takeScreenshot: favorites-heart-filled
# The Saved tab counts it at once, in the right plural form.
- tapOn:
    id: tab-saved
- assertVisible:
    id: saved-favorites
    text: Улюблене, 1 запис
- takeScreenshot: favorites-saved-overview
- tapOn:
    id: saved-favorites
- assertVisible:
    id: favorites-count
    text: 1 запис
- assertVisible:
    id: entry-row-.*-open
- takeScreenshot: favorites-list
# The row opens the Entry screen: the card of the one Entry the heart kept,
# a Word or a Correction, with its heart filled. A double tap opens it once:
# one back returns to the list.
- doubleTapOn:
    id: entry-row-.*-open
- assertVisible:
    id: entry-screen
- tapOn:
    id: entry-screen-back
- assertVisible:
    id: favorites-count
- assertNotVisible:
    id: entry-screen
- tapOn:
    id: entry-row-.*-open
- assertVisible:
    id: entry-screen
- scrollUntilVisible:
    element:
      id: favorite-button
# Then off the tab bar, which covers the bottom of a card that barely fits: a
# short slow drag scrolls the card further, or to its end, and is too short
# and slow to turn the page.
- swipe:
    start: 50%, 60%
    end: 50%, 48%
    duration: 800
# A tap while the card still glides only stops it.
- waitForAnimationToEnd
- tapOn:
    id: favorite-button
    text: Прибрати з Улюбленого
# The Entry screen stays open after its Entry leaves Favorites.
- assertVisible:
    id: favorite-button
    text: Додати в Улюблене
- assertVisible:
    id: entry-screen
- takeScreenshot: favorites-entry-screen
- tapOn:
    id: entry-screen-back
- assertVisible:
    id: favorites-empty
- takeScreenshot: favorites-empty
- tapOn:
    id: favorites-back
- assertVisible:
    id: saved-favorites
    text: Улюблене, 0 записів
- tapOn:
    id: tab-home
- assertVisible:
    id: home
