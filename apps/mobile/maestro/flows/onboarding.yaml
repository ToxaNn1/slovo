# Onboarding: a fresh install shows the welcome over the Feed; «Почати»,
# «Далі», the Rarity Test's «Пізніше» and «Пізніше» lead to the fifth step,
# «КРОК 5 З 5», SLOVO ID, whose
# «Увійти через SLOVO ID» opens the SLOVO ID screen and whose back link,
# signed out, comes back to the step; «Продовжити без акаунта» finishes the
# onboarding, and a relaunch shows no onboarding. («Пропустити» finishes it on
# every fresh install, see `open-in-dev-client.yaml`.) A subflow of
# `smoke.yaml`; run it from there. It starts from a fresh install, whatever the
# simulator holds, so it clears the app's state: put it last in the smoke flow,
# as it takes the Favorites and the other choices with it.
appId: ${APP_ID || 'app.slovo.uk'}
---
# A fresh install shows the welcome.
- runFlow:
    file: ../fresh-onboarding.yaml
- assertVisible:
    id: onboarding
- assertVisible:
    id: onboarding-hero-lemma
- assertVisible:
    id: onboarding-start
- assertVisible:
    id: onboarding-skip
- takeScreenshot: onboarding-welcome
# The onboarding covers the Feed: no Feed card is reachable behind it.
- assertNotVisible:
    id: feed-card-.*
- tapOn:
    id: onboarding-start
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-rarity-later
- tapOn:
    id: onboarding-later
# The fifth step, with the Edition's Account on.
- assertVisible:
    id: onboarding-account
- assertVisible: КРОК 5 З 5
- assertVisible:
    id: onboarding-sign-in
    text: Увійти через SLOVO ID
- assertVisible:
    id: onboarding-continue
    text: Продовжити без акаунта
- takeScreenshot: onboarding-account
# «Увійти через SLOVO ID» opens the SLOVO ID screen over the step; coming back
# signed out stays on the step.
- tapOn:
    id: onboarding-sign-in
- assertVisible:
    id: account-email
- assertNotVisible:
    id: onboarding-account
- tapOn:
    id: account-back
- assertVisible:
    id: onboarding-account
# «Продовжити без акаунта» finishes the onboarding and brings the Feed.
- tapOn:
    id: onboarding-continue
- assertVisible:
    id: feed-card-.*
- assertNotVisible:
    id: onboarding-account
# A relaunch brings the Feed, with no onboarding.
- stopApp
- launchApp:
    clearState: false
- runFlow:
    file: ../open-in-dev-client.yaml
    env:
      PASS_ONBOARDING: 'false'
- assertVisible:
    id: feed-card-.*
- assertNotVisible:
    id: onboarding
