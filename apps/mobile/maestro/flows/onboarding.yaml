# Onboarding: a fresh install shows the welcome over the Dashboard, step 1 of
# 8; «До першого слова» leads to the first Word, today's Word of the Day; «Беру!»
# to the voice; «ОБИРАЮ» to «Грай»; «Зіграю!» to the level, whose «Перевір
# мене» opens the 10-word Rarity Test in its place; the test leads to «Навіщо»,
# whose «Пізніше» keeps the defaults and leads to the Daily Goal, with the
# Edition's highlighted goal picked; «Обираю» with another goal picked leads to
# the reminder, whose «Без нагадувань» finishes the onboarding on the Dashboard
# and asks nothing; Settings shows the goal picked; a relaunch shows no
# onboarding. («Пропустити» finishes it on every fresh install, see
# `open-in-dev-client.yaml`.) A subflow of `smoke.yaml`; run it from there. It
# starts from a fresh install, whatever the simulator holds, so it clears the
# app's state: put it last in the smoke flow, as it takes the Favorites and the
# other choices with it.
appId: ${APP_ID || 'app.slovo.uk'}
---
# A fresh install shows the welcome.
- runFlow:
    file: ../fresh-onboarding.yaml
- assertVisible:
    id: onboarding
- assertVisible:
    id: onboarding-progress
    text: Крок 1 з 8
- assertVisible: Рідкісні слова рідної мови — нові щодня.
- assertVisible:
    id: onboarding-start
    text: До першого слова
- assertVisible:
    id: onboarding-skip
- takeScreenshot: onboarding-welcome
# The onboarding covers the Dashboard: nothing behind it is reachable.
- assertNotVisible:
    id: dashboard
# The first Word: «ТРИМАЙ!» over the whole screen gives way to today's Word of
# the Day on its card.
- tapOn:
    id: onboarding-start
- extendedWaitUntil:
    visible:
      id: onboarding-next
    timeout: 5000
- assertVisible:
    id: onboarding-first-word
- assertVisible:
    id: onboarding-progress
    text: Крок 2 з 8
- assertVisible: Твоє перше Слово дня. Завтра буде нове.
- assertVisible:
    id: onboarding-next
    text: Беру!
- takeScreenshot: onboarding-first-word
# The voice: a voice per row, to hear and to pick.
- tapOn:
    id: onboarding-next
- assertVisible:
    id: onboarding-voice
- assertVisible:
    id: onboarding-progress
    text: Крок 3 з 8
- assertVisible: Хто читатиме тобі слова?
- assertVisible:
    id: onboarding-voice-list
- assertVisible:
    id: onboarding-next
    text: ОБИРАЮ
- takeScreenshot: onboarding-voice
# «Грай»: the games.
- tapOn:
    id: onboarding-next
- assertVisible:
    id: onboarding-play
- assertVisible:
    id: onboarding-progress
    text: Крок 4 з 8
- assertVisible: Ігри, де треба влучати
- assertVisible:
    id: onboarding-next
    text: Зіграю!
- takeScreenshot: onboarding-play
# The level: one button per option, «Перевір мене» among them, and «Пізніше».
- tapOn:
    id: onboarding-next
- assertVisible:
    id: onboarding-question
- assertVisible:
    id: onboarding-progress
    text: Крок 5 з 8
- assertVisible: Як у тебе з рідкісними словами?
- assertVisible:
    id: onboarding-answer-good
- assertVisible:
    id: onboarding-answer-dont-know
    text: Перевір мене
- assertVisible:
    id: onboarding-later
    text: Пізніше
- takeScreenshot: onboarding-level
# «Перевір мене» opens the Rarity Test on the same step: «Знаю» on each of its
# 10 Words, then its result, whose «Далі» goes on. A Mix with no Words to draw
# goes on at once.
- tapOn:
    id: onboarding-answer-dont-know
- extendedWaitUntil:
    visible:
      id: onboarding-rarity-question|onboarding-question
    timeout: 10000
- runFlow:
    when:
      visible:
        id: onboarding-rarity-question
    commands:
      - assertVisible:
          id: onboarding-progress
          text: Крок 5 з 8
      - assertVisible:
          id: onboarding-rarity-unknown
      - takeScreenshot: onboarding-rarity-test
      - repeat:
          while:
            visible:
              id: onboarding-rarity-known
          times: 12
          commands:
            - tapOn:
                id: onboarding-rarity-known
      - runFlow:
          when:
            visible:
              id: onboarding-rarity-result
          commands:
            - takeScreenshot: onboarding-rarity-result
            - tapOn:
                id: onboarding-rarity-next
                text: Далі
# «Навіщо»: one button per option.
- assertVisible:
    id: onboarding-question
- assertVisible:
    id: onboarding-progress
    text: Крок 6 з 8
- assertVisible: Чого ти хочеш від SLOVO?
- assertVisible:
    id: onboarding-answer-rare-words
- takeScreenshot: onboarding-why
# «Пізніше» keeps the defaults and goes on to the Daily Goal, 10 picked.
- tapOn:
    id: onboarding-later
- assertVisible:
    id: onboarding-daily-goal
- assertVisible:
    id: onboarding-progress
    text: Крок 7 з 8
- assertVisible: Скільки слів на день?
- assertVisible:
    id: onboarding-daily-goal-10
    selected: true
- takeScreenshot: onboarding-daily-goal
# «Обираю» with 25 picked goes on to the reminder.
- tapOn:
    id: onboarding-daily-goal-25
- assertVisible:
    id: onboarding-daily-goal-25
    selected: true
- tapOn:
    id: onboarding-done
    text: Обираю
- assertVisible:
    id: onboarding-notification-time
- assertVisible:
    id: onboarding-progress
    text: Крок 8 з 8
- assertVisible: Коли нагадати про слово?
- assertVisible:
    id: onboarding-time-09:00
    text: 9:00
- assertVisible:
    id: onboarding-time-20:30
- assertVisible:
    id: onboarding-time-none
    text: Без нагадувань
- takeScreenshot: onboarding-reminder
# «Без нагадувань» asks for nothing and finishes the onboarding on the Dashboard.
- tapOn:
    id: onboarding-time-none
- assertVisible:
    id: dashboard
- assertNotVisible:
    id: onboarding-notification-time
- assertNotVisible:
    id: onboarding-skip
# Settings shows the goal picked.
- runFlow:
    file: ../open-settings-row.yaml
    env:
      ROW: settings-row-daily-goal
- tapOn:
    id: settings-row-daily-goal
- assertVisible:
    id: daily-goal-25
    selected: true
- tapOn:
    id: daily-goal-back
- runFlow:
    file: ../leave-settings.yaml
- tapOn:
    id: tab-home
# A relaunch brings the Feed, with no onboarding.
- stopApp
- launchApp:
    clearState: false
- runFlow:
    file: ../open-in-dev-client.yaml
    env:
      PASS_ONBOARDING: 'false'
- assertVisible:
    id: feed-card-.*
- assertNotVisible:
    id: onboarding
