# Collections: the Saved tab's «Колекції» tab shows them as cards, two to a row,
# after the «Нова колекція» card; with none, the empty state has its own
# «Нова колекція» button instead. Either opens the name sheet, which makes a
# Collection (a taken name is refused). The menu a long press on a card opens
# renames it in the same sheet and deletes it after the delete sheet asks. A
# subflow of `smoke.yaml`; run it from there.
# Names are Latin, so the keyboard of any simulator can type them. It leaves
# the Collections it found.
appId: ${APP_ID || 'app.slovo.uk'}
---
- tapOn:
    id: tab-saved
- tapOn:
    id: saved-collections
- assertVisible:
    id: collections
# The development client's floating tools button sits over «Нова колекція»:
# drag it down for the flow, and back at the end.
- swipe:
    from:
      id: gearshape.fill
    direction: DOWN
    duration: 600
- runFlow:
    file: ../dismiss-dev-menu.yaml
- takeScreenshot: collections-start
# A new Collection, named in the sheet: from the empty state on a fresh state,
# from the «Нова колекція» card once there are Collections.
- runFlow:
    when:
      visible:
        id: collections-empty-create
    commands:
      - tapOn:
          id: collections-empty-create
- runFlow:
    when:
      notVisible:
        id: collections-name-input
    commands:
      - tapOn:
          id: collections-add
- waitForAnimationToEnd
# The keyboard rises only on a tap on the field.
- tapOn:
    id: collections-name-input
- inputText: Alpha
- tapOn:
    id: collections-name-submit
- assertVisible:
    id: collection-card-.*
    text: Alpha, 0 слів
- assertNotVisible:
    id: collections-name-input
- assertNotVisible:
    id: collections-empty
# Newest first: a second Collection comes before the first.
- tapOn:
    id: collections-add
- waitForAnimationToEnd
- tapOn:
    id: collections-name-input
- inputText: Bravo
- tapOn:
    id: collections-name-submit
- assertVisible:
    id: collection-card-.*
    text: Bravo, 0 слів
- takeScreenshot: collections-created
# A name that breaks a rule stays in the field with its reason, in any letter case.
- tapOn:
    id: collections-add
- waitForAnimationToEnd
- tapOn:
    id: collections-name-input
- inputText: bRAVO
- tapOn:
    id: collections-name-submit
- assertVisible:
    id: collections-name-refusal
    text: Колекція з такою назвою вже є.
- takeScreenshot: collections-refused
# «Скасувати» drops the sheet and the name in it.
- tapOn:
    id: collections-name-cancel
- assertNotVisible:
    id: collections-name-input
# The Collections tab counts what the list made.
- assertVisible:
    id: saved-collections
    text: 'Колекції, [2-9]\d* колекці.*'
# A long press while the screen still slides in is lost, and a long list slides in later.
- waitForAnimationToEnd
# A long press on «Bravo» opens its menu; «Перейменувати» opens the name sheet, with its name in it.
- longPressOn:
    id: collection-card-.*
    text: Bravo, 0 слів
# A tap while the sheet still slides in is lost.
- waitForAnimationToEnd
- takeScreenshot: collections-menu
- tapOn:
    id: collections-menu-rename
- waitForAnimationToEnd
- assertVisible:
    id: collections-name-input
    text: Bravo
- tapOn:
    id: collections-name-input
- eraseText: 40
- inputText: Charlie
- takeScreenshot: collections-renaming
- tapOn:
    id: collections-name-submit
- assertVisible:
    id: collection-card-.*
    text: Charlie, 0 слів
- assertNotVisible:
    text: Bravo, 0 слів
# A name another Collection has is refused while renaming.
- longPressOn:
    id: collection-card-.*
    text: Charlie, 0 слів
# A tap while the sheet still slides in is lost.
- waitForAnimationToEnd
- tapOn:
    id: collections-menu-rename
- waitForAnimationToEnd
- tapOn:
    id: collections-name-input
- eraseText: 40
- inputText: alpha
- tapOn:
    id: collections-name-submit
- assertVisible:
    id: collections-name-refusal
    text: Колекція з такою назвою вже є.
- tapOn:
    id: collections-name-cancel
- waitForAnimationToEnd
- assertVisible:
    text: Charlie, 0 слів
# «Видалити колекцію» in the menu: the delete sheet asks first, and «Скасувати» keeps it.
- longPressOn:
    id: collection-card-.*
    text: Charlie, 0 слів
# A tap while the sheet still slides in is lost.
- waitForAnimationToEnd
- tapOn:
    id: collections-menu-delete
- waitForAnimationToEnd
- assertVisible: Видалити колекцію «Charlie»?
- assertVisible: Самі записи нікуди не зникнуть.
- takeScreenshot: collections-delete-confirm
- tapOn:
    id: collections-delete-cancel
- assertVisible:
    text: Charlie, 0 слів
- longPressOn:
    id: collection-card-.*
    text: Charlie, 0 слів
# A tap while the sheet still slides in is lost.
- waitForAnimationToEnd
- tapOn:
    id: collections-menu-delete
# A tap while the sheet still slides in is lost.
- waitForAnimationToEnd
- tapOn:
    id: collections-delete-confirm
- assertNotVisible:
    text: Charlie, 0 слів
# «Cancel» in the menu keeps everything as it is.
- longPressOn:
    id: collection-card-.*
    text: Alpha, 0 слів
# A tap while the sheet still slides in is lost.
- waitForAnimationToEnd
- tapOn:
    id: collections-menu-cancel
- assertVisible:
    text: Alpha, 0 слів
# «Alpha» goes through the menu and the delete sheet, leaving the Collections the flow found.
- longPressOn:
    id: collection-card-.*
    text: Alpha, 0 слів
# A tap while the sheet still slides in is lost.
- waitForAnimationToEnd
- tapOn:
    id: collections-menu-delete
- waitForAnimationToEnd
- assertVisible: Видалити колекцію «Alpha»?
- tapOn:
    id: collections-delete-confirm
- assertNotVisible:
    text: Alpha, 0 слів
- swipe:
    from:
      id: gearshape.fill
    direction: UP
    duration: 600
- runFlow:
    file: ../dismiss-dev-menu.yaml
- tapOn:
    id: tab-home
- assertVisible:
    id: home
