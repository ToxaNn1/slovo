# Collections: the Saved tab's «Колекції» tab shows them in place, «+» makes a Collection
# (a taken name is refused), a swipe or the «…» menu renames it in place and
# deletes it after the SLOVO dialog. A subflow of `smoke.yaml`; run it from there.
# Names are Latin, so the keyboard of any simulator can type them. It leaves
# the Collections it found.
appId: ${APP_ID || 'app.slovo.uk'}
---
- tapOn:
    id: tab-saved
- tapOn:
    id: saved-collections
- assertVisible:
    id: collections
# The development client's floating tools button sits over «+»: drag it down for
# the flow, and back at the end.
- swipe:
    from:
      id: gearshape.fill
    direction: DOWN
    duration: 600
- runFlow:
    file: ../dismiss-dev-menu.yaml
# A fresh state shows the empty list with its own button; a state that has Collections shows «+».
- takeScreenshot: collections-start
# A new Collection, named in the field that «+» opens.
- tapOn:
    id: collections-add
- assertVisible:
    id: collections-new-input
- inputText: Alpha
- pressKey: Enter
- assertVisible:
    id: collection-.*-content
    text: Alpha, 0 записів
- assertNotVisible:
    id: collections-new
# Newest first: a second Collection comes above the first.
- tapOn:
    id: collections-add
- inputText: Bravo
- pressKey: Enter
- assertVisible:
    id: collection-.*-content
    text: Bravo, 0 записів
- takeScreenshot: collections-created
# A name that breaks a rule stays in the field with its reason, in any letter case.
- tapOn:
    id: collections-add
- inputText: bRAVO
- pressKey: Enter
- assertVisible:
    id: collections-new-refusal
    text: Колекція з такою назвою вже є.
- takeScreenshot: collections-refused
# Leaving the field drops it: a tap on the Saved title, the first «Збережене» over the tab bar's.
- tapOn:
    text: Збережене
    index: 0
- assertNotVisible:
    id: collections-new
# The Collections tab counts what the list made.
- assertVisible:
    id: saved-collections
    text: 'Колекції, [2-9]\d* колекці.*'
# A swipe while the screen still slides in is lost, and a long list slides in later.
- waitForAnimationToEnd
# Swipe «Bravo» to «Назва»: its row becomes the field, with its name in it.
- swipe:
    from:
      text: Bravo, 0 записів
    direction: LEFT
- takeScreenshot: collections-swiped
- tapOn:
    id: collection-.*-rename
- assertVisible:
    id: collections-rename-input
    text: Bravo
- eraseText: 5
- inputText: Charlie
- takeScreenshot: collections-renaming
- pressKey: Enter
- assertVisible:
    id: collection-.*-content
    text: Charlie, 0 записів
- assertNotVisible:
    text: Bravo, 0 записів
# A name another Collection has is refused while renaming.
- swipe:
    from:
      text: Charlie, 0 записів
    direction: LEFT
- tapOn:
    id: collection-.*-rename
- eraseText: 7
- inputText: alpha
- pressKey: Enter
- assertVisible:
    id: collections-rename-refusal
    text: Колекція з такою назвою вже є.
- tapOn: Колекції
- assertVisible:
    text: Charlie, 0 записів
# Swipe to «Видалити»: the SLOVO dialog asks first, and cancelling keeps it.
- swipe:
    from:
      text: Charlie, 0 записів
    direction: LEFT
- tapOn:
    id: collection-.*-delete
- assertVisible: Видалити колекцію «Charlie»?
- assertVisible: Самі записи нікуди не зникнуть.
- takeScreenshot: collections-delete-confirm
- tapOn:
    id: collections-delete-cancel
- assertVisible:
    text: Charlie, 0 записів
- swipe:
    from:
      text: Charlie, 0 записів
    direction: LEFT
- tapOn:
    id: collection-.*-delete
# A tap while the dialog still fades in is lost.
- waitForAnimationToEnd
- tapOn:
    id: collections-delete-destructive
- assertNotVisible:
    text: Charlie, 0 записів
# The «…» button offers the same two actions: rename first.
- tapOn:
    id: collection-.*-more
- assertVisible:
    id: collections-menu-rename
- takeScreenshot: collections-menu
# A tap while the sheet still slides in is lost.
- waitForAnimationToEnd
- tapOn:
    id: collections-menu-rename
- assertVisible:
    id: collections-rename-input
    text: Alpha
- eraseText: 5
- inputText: Delta
- pressKey: Enter
- assertVisible:
    id: collection-.*-content
    text: Delta, 0 записів
- assertNotVisible:
    text: Alpha, 0 записів
# «Cancel» in the menu keeps everything as it is.
- tapOn:
    id: collection-.*-more
- waitForAnimationToEnd
- tapOn:
    id: collections-menu-cancel
- assertVisible:
    text: Delta, 0 записів
# «Delta» goes through the menu and the SLOVO dialog, leaving the Collections the flow found.
- tapOn:
    id: collection-.*-more
- waitForAnimationToEnd
- tapOn:
    id: collections-menu-delete
- waitForAnimationToEnd
- assertVisible: Видалити колекцію «Delta»?
- tapOn:
    id: collections-delete-destructive
- assertNotVisible:
    text: Delta, 0 записів
- swipe:
    from:
      id: gearshape.fill
    direction: UP
    duration: 600
- runFlow:
    file: ../dismiss-dev-menu.yaml
- tapOn:
    id: tab-home
- assertVisible:
    id: home
