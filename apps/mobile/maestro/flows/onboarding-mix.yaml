# Onboarding step 2, the Mix: «Почати» leads to «КРОК 2 З 4» with the chips of
# Мій Мікс; taking a Category out and going on shows in Settings › Мій Мікс.
# A subflow of `smoke.yaml`; run it from there. It starts from a fresh install,
# whatever the simulator holds, so it clears the app's state: put it last in
# the smoke flow, as it takes the Favorites and the other choices with it.
appId: ${APP_ID || 'app.slovo.uk'}
---
# A fresh install shows the welcome.
- runFlow:
    file: ../fresh-onboarding.yaml
- tapOn:
    id: onboarding-start
- assertVisible:
    id: onboarding-mix
- assertVisible:
    id: onboarding-step
- assertVisible: КРОК 2 З 4
# The Edition's default Mix: «Усі» is on.
- assertVisible:
    id: mix-chip-all
    selected: true
- takeScreenshot: onboarding-mix
# Taking a Category out applies at once.
- tapOn:
    id: mix-chip-technology
- assertVisible:
    id: mix-chip-technology
    selected: false
- assertVisible:
    id: mix-chip-all
    selected: false
# «Далі» goes on to the notifications step, with the choice kept; «Пізніше»
# goes on without asking, and «Продовжити без акаунта» finishes.
- tapOn:
    id: onboarding-next
- assertVisible:
    id: onboarding-notifications
- tapOn:
    id: onboarding-later
- tapOn:
    id: onboarding-continue
- assertVisible:
    id: feed-card-.*
- assertNotVisible:
    id: onboarding-mix
- runFlow:
    file: ../open-settings-row.yaml
    env:
      ROW: settings-row-my-mix
# Settings › Мій Мікс counts the Categories left in the Mix (10 − 1).
- assertVisible:
    id: settings-row-my-mix
    text: Мій Мікс, 9 категорій
- tapOn:
    id: settings-row-my-mix
- assertVisible:
    id: mix-chip-technology
    selected: false
- tapOn:
    id: mix-back
