# The Rarity Ceiling (ADR 0072): Мій Мікс offers «до 1» to «до 5», «до 5» by
# default, until its own Settings row (#1545); a lower ceiling is kept and the
# Feed still shows a card. A subflow of `smoke.yaml`; run it from there. It
# starts by putting the ceiling back to «до 5», whatever an earlier run left,
# and leaves it there.
appId: ${APP_ID || 'app.slovo.uk'}
---
- runFlow:
    file: ../open-settings-row.yaml
    env:
      ROW: settings-row-my-mix
- tapOn:
    id: settings-row-my-mix
- assertVisible:
    id: mix
- scrollUntilVisible:
    element:
      id: mix-rarity-ceiling-1
    centerElement: true
- runFlow:
    when:
      visible:
        id: mix-rarity-ceiling-5
        selected: false
    commands:
      - tapOn:
          id: mix-rarity-ceiling-5
- assertVisible:
    id: mix-rarity-ceiling-5
    text: до 5
    selected: true
# A lower ceiling applies at once: its chip is filled, the others are not.
- tapOn:
    id: mix-rarity-ceiling-1
- assertVisible:
    id: mix-rarity-ceiling-1
    text: до 1
    selected: true
- assertVisible:
    id: mix-rarity-ceiling-5
    selected: false
- takeScreenshot: rarity-ceiling-1
# The Mix keeps it: the screen opens as it was left.
- tapOn:
    id: mix-back
- tapOn:
    id: settings-row-my-mix
- scrollUntilVisible:
    element:
      id: mix-rarity-ceiling-1
    centerElement: true
- assertVisible:
    id: mix-rarity-ceiling-1
    selected: true
# The Feed still has a card under the ceiling: only the commonest Words, and
# the Entries of other kinds, which have no rarity.
- tapOn:
    id: mix-back
- tapOn:
    id: tab-home
- assertVisible:
    id: (word|correction|idiom)-card
# Back to «до 5».
- runFlow:
    file: ../open-settings-row.yaml
    env:
      ROW: settings-row-my-mix
- tapOn:
    id: settings-row-my-mix
- scrollUntilVisible:
    element:
      id: mix-rarity-ceiling-5
    centerElement: true
- tapOn:
    id: mix-rarity-ceiling-5
- assertVisible:
    id: mix-rarity-ceiling-5
    selected: true
- tapOn:
    id: mix-back
- assertVisible:
    id: settings-row-my-mix
