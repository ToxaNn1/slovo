# The Rarity Ceiling (ADR 0072): Settings' «Рідкість» row offers «до 1» to
# «до 5» (#1545); a lower ceiling is kept and the Feed still shows a card. A
# subflow of `smoke.yaml`; run it from there. It starts by putting the ceiling
# back to «до 5», whatever an earlier run left, and leaves it there.
appId: ${APP_ID || 'app.slovo.uk'}
---
- runFlow:
    file: ../open-settings-row.yaml
    env:
      ROW: settings-rarity-5
# «до 5»'s left part: the development client's floating tools button may sit
# over its right end.
- tapOn:
    id: settings-rarity-5
    point: 25%, 50%
- assertVisible:
    id: settings-rarity-5
    text: 'Рідкість: до 5'
    selected: true
# A lower ceiling applies at once: its segment is selected, the others are not.
- tapOn:
    id: settings-rarity-1
- assertVisible:
    id: settings-rarity-1
    text: 'Рідкість: до 1'
    selected: true
- assertVisible:
    id: settings-rarity-5
    selected: false
- takeScreenshot: rarity-ceiling-1
# The Feed still has a card under the ceiling: only the commonest Words, and
# the Entries of other kinds, which have no rarity.
- runFlow: ../leave-settings.yaml
- tapOn:
    id: tab-home
- assertVisible:
    id: feed-card-.*
# Settings keeps it: the row opens as it was left. Then back to «до 5».
- runFlow:
    file: ../open-settings-row.yaml
    env:
      ROW: settings-rarity-1
- assertVisible:
    id: settings-rarity-1
    selected: true
- tapOn:
    id: settings-rarity-5
    point: 25%, 50%
- assertVisible:
    id: settings-rarity-5
    selected: true
- runFlow: ../leave-settings.yaml
