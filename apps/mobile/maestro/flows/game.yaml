# The Game: «Вгадай слово» from the Game tab, the first option and «Далі» in
# every Round until the result screen with the best result, which the stats
# sheet shows too, then «Ще раз» for a new Game, and the ✕ that asks «Вийти з
# гри?» before it drops it, back to the mode screen with the best result.
# A subflow of `smoke.yaml`; run it from there. It starts on the mode screen,
# as the app keeps a Game in memory only and the smoke flow launches it anew.
appId: ${APP_ID || 'app.slovo.uk'}
---
- tapOn:
    id: tab-game
- assertVisible:
    id: game-modes
- tapOn:
    id: game-mode-guess-word
- assertVisible:
    id: game-round
- assertVisible:
    id: game-prompt
- assertVisible:
    id: game-lives
# At most 15 Rounds; five wrong answers end the Game sooner. Each scroll brings
# its target up at the largest text sizes and does nothing otherwise.
- repeat:
    while:
      notVisible:
        id: game-result
    times: 15
    commands:
      - scrollUntilVisible:
          element:
            id: game-option-0
          direction: DOWN
      - tapOn:
          id: game-option-0
      - assertVisible:
          id: game-sheet-title
      - scrollUntilVisible:
          element:
            id: game-next
          direction: DOWN
      # One tap: a second one, while the sheet slides away, would land on the tab bar.
      - tapOn:
          id: game-next
          retryTapIfNoChange: false
      - waitForAnimationToEnd
- assertVisible:
    id: game-result
- assertVisible:
    id: game-result-rounds
- assertVisible:
    id: game-result-best
# The stats sheet shows the best result; the Game tab keeps the result screen meanwhile.
- tapOn:
    id: tab-home
- tapOn:
    id: stats-pill
- assertVisible:
    id: stats-game-best
- tapOn:
    point: 50%, 12%
- assertNotVisible:
    id: stats-sheet
- tapOn:
    id: tab-game
- assertVisible:
    id: game-result
- scrollUntilVisible:
    element:
      id: game-again
    direction: DOWN
- tapOn:
    id: game-again
# A new Game: a Round to answer, no result.
- assertVisible:
    id: game-round
- assertVisible:
    id: game-option-0
# Another tab and back finds the Game where it was.
- tapOn:
    id: tab-saved
- assertVisible:
    id: saved
- tapOn:
    id: tab-game
- assertVisible:
    id: game-round
- assertVisible:
    id: game-option-0
# The ✕ asks first; «Грати далі» returns to the same Round.
- tapOn:
    id: game-exit
- assertVisible: Вийти з гри?
- takeScreenshot: game-exit-confirm
- tapOn: Грати далі
- assertVisible:
    id: game-round
- assertVisible:
    id: game-option-0
# «Вийти» drops the Game: the mode screen shows again.
- tapOn:
    id: game-exit
- assertVisible: Вийти з гри?
# A tap while the alert is still opening is lost.
- waitForAnimationToEnd
- tapOn: Вийти
- assertVisible:
    id: game-modes
# The finished Game above counts: the mode screen shows the best result.
- assertVisible:
    id: game-rules
    text: '.*Найкраще — \d+ / 15\.'
- assertNotVisible:
    id: game-round
