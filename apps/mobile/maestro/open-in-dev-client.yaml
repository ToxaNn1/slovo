# Opens the app's JavaScript from Metro in the development client and waits
# for the Feed, setting aside the development client's own sheets on the way,
# skipping the onboarding a fresh install opens over the Dashboard and going
# from the Dashboard's Word of the Day hero to the Feed. A flow that
# checks the onboarding itself passes `PASS_ONBOARDING: 'false'`, and for the
# onboarding to wait for, `READY_ID: onboarding`.
# `smoke.yaml` runs it after launching the app, with `output.devClientLink`
# set to the development client's link to Metro.
appId: ${APP_ID || 'app.slovo.uk'}
---
- openLink: ${output.devClientLink}
# A simulator asks once whether the link may open the app.
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
# Wait for the Feed: a card of any kind, since the Feed reopens on the card the
# reader was on, which may be a Correction or the end of the Cycle. On a new
# simulator the development client opens its menu over the app, before or after
# the JavaScript loads; close it on the way. The onboarding covers the Dashboard
# on a fresh install, so «Пропустити» on it brings the Dashboard up. The app
# opens on the Dashboard: «РОЗКРИЙ СЛОВО» opens its hero, and «ЩЕ ПРО СЛОВО →»
# on the open hero (straight away once the Word of the Day is Seen) opens the
# Feed. A flow waiting for something else (`READY_ID`) stays where it is.
- repeat:
    while:
      notVisible:
        id: ${READY_ID || 'feed-card-.*'}
    times: 24
    commands:
      - runFlow:
          file: dismiss-dev-menu.yaml
      - runFlow:
          when:
            true: ${PASS_ONBOARDING != 'false'}
            visible:
              id: onboarding-skip
          commands:
            # The label's left end: the development client's floating tools button
            # may sit over its right end.
            - tapOn:
                id: onboarding-skip
                point: 15%, 50%
      - runFlow:
          when:
            true: ${!READY_ID}
            visible:
              id: dashboard-reveal
          commands:
            - tapOn:
                id: dashboard-reveal
      - runFlow:
          when:
            true: ${!READY_ID}
            visible:
              id: dashboard-to-card
          commands:
            - tapOn:
                id: dashboard-to-card
      - extendedWaitUntil:
          visible:
            id: ${READY_ID || 'feed-card-.*'}
          timeout: 5000
          optional: true
- assertVisible:
    id: ${READY_ID || 'feed-card-.*'}
# The Feed shows its gestures hint once on a device, a moment after the cards;
# «ЗРОЗУМІЛО» closes it.
- runFlow:
    when:
      true: ${!READY_ID}
    commands:
      - extendedWaitUntil:
          visible:
            id: gestures-hint-dismiss
          timeout: 3000
          optional: true
      - runFlow:
          when:
            visible:
              id: gestures-hint-dismiss
          commands:
            - tapOn:
                id: gestures-hint-dismiss
# The app's splash covers everything for a moment, then fades out.
- extendedWaitUntil:
    notVisible:
      id: splash
    timeout: 10000
- runFlow:
    file: dismiss-dev-menu.yaml
# The development client's floating tools button stays where an earlier run left
# it, perhaps over a button of the app: put it at the top of the screen, where
# the flows know to tap around it. A drag that counts as a tap opens the menu.
- runFlow:
    when:
      visible:
        id: gearshape.fill
    commands:
      - swipe:
          from:
            id: gearshape.fill
          direction: UP
          duration: 600
      - runFlow:
          file: dismiss-dev-menu.yaml
