# The full app pass (ADR 0177): one flow that opens every screen route of
# `apps/mobile/src/app` and the sheets a tap opens, keeping a screenshot of
# each. Run it from the repo root with `pnpm app-pass` (scripts/app-pass.mjs),
# on a booted simulator with the app open from the one Metro on 8082.
#
# Every route file is one step below: `app-pass/open.yaml` opens its link,
# or taps lead to it and `app-pass/screen.yaml` checks it, each with the
# route as `ROUTE`. `app-pass.test.ts` fails CI naming each route file no
# step names, and each `ROUTE` no route file has: a new screen joins the pass
# in the same change.
#
# The pass reads and keeps the reader's state: it saves, files and sends
# nothing. A route behind a Feature Switch that is off leads to its fallback,
# which the step's `SCREEN` names too. The Collection steps need one
# Collection with an Entry on the simulator (`--state full-saved` loads one).
#
# Settings (`-e`): APP_ID, SCHEME or LINK (Expo Go: `exp://127.0.0.1:8082/--/`),
# ENTRY_ID (an Entry of the API, `w_0wr2ne` by default).
appId: ${APP_ID || 'app.slovo.uk'}
---
# Home
- runFlow:
    file: app-pass/open.yaml
    env:
      ROUTE: '/'
      LINK_PATH: ''
      SCREEN: dashboard
- runFlow:
    file: app-pass/open.yaml
    env:
      ROUTE: '/feed'
      LINK_PATH: 'feed'
      SCREEN: feed

# The sheets the Feed opens by a tap, each closed again unused: a card's
# «Більше дій» and its error report, «Додати до колекції», the stats sheet.
- tapOn: 'Вимова'
- tapOn: 'Більше дій'
- waitForAnimationToEnd
- tapOn: 'ПОВІДОМИТИ ПРО ПОМИЛКУ'
- waitForAnimationToEnd
- takeScreenshot: app-pass-sheet-report
- runFlow: app-pass/close-sheet.yaml
- tapOn: 'Додати до колекції'
- waitForAnimationToEnd
- takeScreenshot: app-pass-sheet-collection
- runFlow: app-pass/close-sheet.yaml
- tapOn: 'Статистика: .*'
- waitForAnimationToEnd
- takeScreenshot: app-pass-sheet-stats
- runFlow: app-pass/close-sheet.yaml
- runFlow:
    file: app-pass/open.yaml
    env:
      ROUTE: '/categories'
      LINK_PATH: 'categories'
      SCREEN: categories
- scrollUntilVisible:
    element:
      id: 'categories-(?!back|title)(?!.*-(cascade|name|count)$).+'
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'categories-(?!back|title)(?!.*-(cascade|name|count)$).+'
    index: 0
- runFlow:
    file: app-pass/screen.yaml
    env:
      ROUTE: '/category/[categoryId]'
      SCREEN: category
# With `categoryFeed` off a Category's Entry opens on its own screen.
- scrollUntilVisible:
    element:
      id: 'category-entry-.+'
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'category-entry-.+'
    index: 0
- runFlow:
    file: app-pass/screen.yaml
    env:
      ROUTE: '/category-feed/[categoryId]'
      SCREEN: category-feed-screen|entry-screen
- runFlow:
    file: app-pass/open.yaml
    env:
      ROUTE: '/correction-categories'
      LINK_PATH: 'correction-categories'
      SCREEN: correction-categories
- scrollUntilVisible:
    element:
      id: 'correction-categories-(?!back|title)(?!.*-(cascade|name|count)$).+'
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'correction-categories-(?!back|title)(?!.*-(cascade|name|count)$).+'
    index: 0
- runFlow:
    file: app-pass/screen.yaml
    env:
      ROUTE: '/correction-category/[categoryId]'
      SCREEN: category
# Back to the grid for its Correction types.
- runFlow:
    file: app-pass/open.yaml
    env:
      ROUTE: '/correction-categories'
      LINK_PATH: 'correction-categories'
      SCREEN: correction-categories
- scrollUntilVisible:
    element:
      id: 'correction-types-(?!title)(?!.*-(name|count)$).+'
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'correction-types-(?!title)(?!.*-(name|count)$).+'
    index: 0
- runFlow:
    file: app-pass/screen.yaml
    env:
      ROUTE: '/correction-type/[type]'
      SCREEN: correction-type
# The Dashboard's rail of Curated Collections.
- runFlow:
    file: app-pass/open.yaml
    env:
      ROUTE: '/'
      LINK_PATH: ''
      SCREEN: dashboard
- scrollUntilVisible:
    element:
      id: 'dashboard-curated-collection-[^-]+'
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'dashboard-curated-collection-[^-]+'
    index: 0
- runFlow:
    file: app-pass/screen.yaml
    env:
      ROUTE: '/curated-collection/[collectionId]'
      SCREEN: curated-collection(-error)?
# A collection's Feed from a tap on one of its Entries (the Entry card with the switch off).
- scrollUntilVisible:
    element:
      id: 'curated-collection-entry-[^-]+'
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'curated-collection-entry-[^-]+'
    index: 0
- runFlow:
    file: app-pass/screen.yaml
    env:
      ROUTE: '/curated-collection-feed/[collectionId]'
      SCREEN: curated-collection-feed-screen|entry-screen
# The grid of every Curated Collection, and a collection's screen from its tile.
- runFlow:
    file: app-pass/open.yaml
    env:
      ROUTE: '/curated-collections'
      LINK_PATH: 'curated-collections'
      SCREEN: curated-collections
- scrollUntilVisible:
    element:
      id: 'curated-collections-(?!back|title)(?!.*-(cascade|name|count|mark)$).+'
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: 'curated-collections-(?!back|title)(?!.*-(cascade|name|count|mark)$).+'
    index: 0
- runFlow:
    file: app-pass/screen.yaml
    env:
      ROUTE: '/curated-collection/[collectionId]'
      SCREEN: curated-collection(-error)?
- runFlow:
    file: app-pass/open.yaml
    env:
      ROUTE: '/entry/[entryId]'
      LINK_PATH: "entry/${ENTRY_ID || 'w_0wr2ne'}"
      SCREEN: entry-screen

