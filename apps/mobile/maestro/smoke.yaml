# Simulator smoke flow (spec #2, seam 3; spec #51, seam 4; spec #96, seam 4).
# Run it locally, never in CI:
#
#   SLOVO_EDITION=uk pnpm start          # Metro, in one terminal
#   pnpm test:smoke                      # in another, with the dev build installed
#
# Every setting has a default, and `-e` overrides it:
#   pnpm test:smoke -e METRO_URL=http://localhost:8162
#   pnpm test:smoke -e APP_ID=<bundle id> -e SCHEME=slovo-<edition id>
#
# The defaults live in JavaScript rather than in an `env:` block, because
# Maestro lets the flow's `env:` win over `-e`.
appId: ${APP_ID || 'app.slovo.uk'}
---
- evalScript: ${output.devClientLink = (SCHEME || 'slovo-uk') + '://expo-development-client/?url=' + encodeURIComponent(METRO_URL || 'http://localhost:8081')}
# Keep the app state: clearing it brings back the development client's
# first-launch menu sheet, which covers Home.
- launchApp:
    clearState: false
- runFlow:
    file: open-in-dev-client.yaml

# The feature flows, in order. Each one starts where the last one left off.
- runFlow: flows/launch.yaml
- runFlow: flows/word-of-the-day.yaml
- runFlow: flows/swipes.yaml
- runFlow: flows/pronunciation.yaml
- runFlow: flows/settings.yaml
- runFlow: flows/quick-swipes.yaml
- runFlow: flows/relaunch.yaml
- runFlow: flows/placeholders.yaml
- runFlow: flows/favorites.yaml
- runFlow: flows/collection-sheet.yaml
- runFlow: flows/collection-entries.yaml
- runFlow: flows/collections.yaml
- runFlow: flows/history.yaml
- runFlow: flows/mix.yaml
- runFlow: flows/hiding.yaml
- runFlow: flows/hiding-mix.yaml
- runFlow: flows/hidden.yaml
# Last, as they clear the app's state for a fresh install.
- runFlow: flows/stats-pill.yaml
- runFlow: flows/open-from-notification.yaml
