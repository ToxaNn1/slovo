# Simulator smoke flow (spec #2, seam 3; spec #51, seam 4). Run it locally, never in CI:
#
#   SLOVO_EDITION=uk pnpm start          # Metro, in one terminal
#   pnpm test:smoke                      # in another, with the dev build installed
#
# For another Edition, pass its bundle id and scheme:
#   pnpm test:smoke -e APP_ID=<bundle id> -e SCHEME=slovo-<edition id>
appId: ${APP_ID}
env:
  APP_ID: app.slovo.uk
  SCHEME: slovo-uk
  METRO_URL: http%3A%2F%2Flocalhost%3A8081
---
# Keep the app state: clearing it brings back the development client's
# first-launch menu sheet, which covers Home.
- launchApp:
    clearState: false
# Point the development client at the local Metro server.
- openLink: ${SCHEME}://expo-development-client/?url=${METRO_URL}
# A simulator asks once whether the link may open the app.
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
# The development client explains its menu on the first launch.
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- extendedWaitUntil:
    visible:
      id: word-lemma
    timeout: 120000
# The app's splash covers everything for a moment, then fades out.
- extendedWaitUntil:
    notVisible:
      id: splash
    timeout: 10000

# The four tabs, in order: Home, Settings, Game, Saved.
- assertVisible:
    id: tab-home
- assertVisible:
    id: tab-settings
    rightOf:
      id: tab-home
- assertVisible:
    id: tab-game
    rightOf:
      id: tab-settings
- assertVisible:
    id: tab-saved
    rightOf:
      id: tab-game

# Home shows a Word from the bundled Language Pack, with a Stress mark
# (U+0301, the combining acute accent) in its Lemma.
# prettier-ignore
- assertVisible:
    id: word-lemma
    text: ".*\u0301.*"
- assertVisible:
    id: word-part-of-speech
- assertVisible:
    id: word-definition

# Home is the Feed: swipe up to the next Word and down back to the first.
- assertVisible:
    id: feed-card-0
- swipe:
    start: 50%, 70%
    end: 50%, 20%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    id: feed-card-1
- assertNotVisible:
    id: feed-card-0
# prettier-ignore
- assertVisible:
    id: word-lemma
    text: ".*\u0301.*"
- swipe:
    start: 50%, 30%
    end: 50%, 80%
    duration: 300
- waitForAnimationToEnd
- assertVisible:
    id: feed-card-0

# Settings: the Theme and the font size follow the choice, which survives a
# relaunch. The preview card shows the Lemma at the chosen size.
- tapOn:
    id: tab-settings
- tapOn:
    id: settings-theme-dark
- assertVisible:
    id: settings-theme-dark
    selected: true
- assertVisible:
    id: settings-font-size-M
    selected: true
- tapOn:
    id: settings-font-size-L
- assertVisible:
    id: settings-font-size-L
    selected: true
- assertVisible:
    id: font-size-preview-lemma
# The Feed redraws in the dark Theme at the new size.
- tapOn:
    id: tab-home
- assertVisible:
    id: word-lemma
- stopApp
- launchApp:
    clearState: false
- openLink: ${SCHEME}://expo-development-client/?url=${METRO_URL}
- extendedWaitUntil:
    visible:
      id: word-lemma
    timeout: 120000
# The app's splash covers everything for a moment, then fades out.
- extendedWaitUntil:
    notVisible:
      id: splash
    timeout: 10000
- tapOn:
    id: tab-settings
- assertVisible:
    id: settings-theme-dark
    selected: true
- assertVisible:
    id: settings-font-size-L
    selected: true
- tapOn:
    id: settings-theme-system
- assertVisible:
    id: settings-theme-system
    selected: true
- tapOn:
    id: settings-font-size-M
- assertVisible:
    id: settings-font-size-M
    selected: true
- tapOn:
    id: tab-game
- assertVisible:
    id: game-placeholder
- tapOn:
    id: tab-saved
- assertVisible:
    id: saved-placeholder
- tapOn:
    id: tab-home
- assertVisible:
    id: word-lemma
