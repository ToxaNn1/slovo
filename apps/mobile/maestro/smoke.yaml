# Simulator smoke flow, the 0.2 flow (spec #2, seam 3; spec #51, seam 4).
# Run it locally, never in CI:
#
#   SLOVO_EDITION=uk pnpm start          # Metro, in one terminal
#   pnpm test:smoke                      # in another, with the dev build installed
#
# Every setting has a default, and `-e` overrides it:
#   pnpm test:smoke -e METRO_URL=http://localhost:8162
#   pnpm test:smoke -e APP_ID=<bundle id> -e SCHEME=slovo-<edition id>
#
# The defaults live in JavaScript rather than in an `env:` block, because
# Maestro lets the flow's `env:` win over `-e`.
appId: ${APP_ID || 'app.slovo.uk'}
---
- evalScript: ${output.devClientLink = (SCHEME || 'slovo-uk') + '://expo-development-client/?url=' + encodeURIComponent(METRO_URL || 'http://localhost:8081')}
# Keep the app state: clearing it brings back the development client's
# first-launch menu sheet, which covers Home.
- launchApp:
    clearState: false
- runFlow:
    file: open-in-dev-client.yaml

# Launch: the four tabs, in order: Home, Settings, Game, Saved.
- assertVisible:
    id: tab-home
- assertVisible:
    id: tab-settings
    rightOf:
      id: tab-home
- assertVisible:
    id: tab-game
    rightOf:
      id: tab-settings
- assertVisible:
    id: tab-saved
    rightOf:
      id: tab-game

# The day opens on its Word of the Day: a Word from the bundled Language Pack
# with the badge over its Lemma and a Stress mark (U+0301, the combining
# acute accent) in it. Its Lemma is kept to check that it stays the same
# after a relaunch.
- assertVisible:
    id: feed-card-0
- assertVisible:
    id: word-of-the-day-badge
    text: 'Слово дня · .*'
# prettier-ignore
- assertVisible:
    id: word-lemma
    text: ".*́.*"
- assertVisible:
    id: word-part-of-speech
- assertVisible:
    id: word-definition
- assertVisible:
    id: word-category
- copyTextFrom:
    id: word-lemma
# The first launch shows the swipe hint; it never comes back once seen.
- runFlow:
    when:
      visible:
        id: swipe-hint
    commands:
      - evalScript: ${output.sawSwipeHint = true}

# Swipe up to the next card. A card taller than the screen scrolls first, so
# swipe until the page turns.
- repeat:
    while:
      notVisible:
        id: feed-card-1
    times: 6
    commands:
      - swipe:
          start: 50%, 70%
          end: 50%, 20%
          duration: 300
      - waitForAnimationToEnd
- assertVisible:
    id: feed-card-1
- assertNotVisible:
    id: feed-card-0
- assertNotVisible:
    id: word-of-the-day-badge
- assertNotVisible:
    id: swipe-hint
# Back down to the first card.
- repeat:
    while:
      notVisible:
        id: feed-card-0
    times: 6
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
          duration: 300
      - waitForAnimationToEnd
- assertVisible:
    id: feed-card-0

# The Pronunciation button reads the Lemma aloud; on a device without a voice
# for the Edition's language it explains why instead. A tap on the message
# closes it.
- tapOn:
    id: word-pronunciation
- runFlow:
    when:
      visible:
        id: pronunciation-no-voice
    commands:
      - tapOn:
          id: pronunciation-no-voice
- assertVisible:
    id: word-pronunciation

# Settings: Theme Dark and font size L. The preview card shows the Lemma at
# the chosen size.
- tapOn:
    id: tab-settings
- tapOn:
    id: settings-theme-dark
- assertVisible:
    id: settings-theme-dark
    selected: true
- assertVisible:
    id: settings-font-size-M
    selected: true
- tapOn:
    id: settings-font-size-L
- assertVisible:
    id: settings-font-size-L
    selected: true
- assertVisible:
    id: font-size-preview-lemma
# The Feed redraws in the dark Theme at the new size, on the same card.
- tapOn:
    id: tab-home
- assertVisible:
    id: feed-card-0
- assertVisible:
    id: word-lemma
    text: ${maestro.copiedText}

# The choices and the day's Word survive a relaunch, and the swipe hint
# stays away.
- stopApp
- launchApp:
    clearState: false
- runFlow:
    file: open-in-dev-client.yaml
- assertVisible:
    id: word-of-the-day-badge
- assertVisible:
    id: word-lemma
    text: ${maestro.copiedText}
- assertNotVisible:
    id: swipe-hint
- tapOn:
    id: tab-settings
- assertVisible:
    id: settings-theme-dark
    selected: true
- assertVisible:
    id: settings-font-size-L
    selected: true
# Back to the defaults, so the next run starts the same way.
- tapOn:
    id: settings-theme-system
- assertVisible:
    id: settings-theme-system
    selected: true
- tapOn:
    id: settings-font-size-M
- assertVisible:
    id: settings-font-size-M
    selected: true
- tapOn:
    id: tab-game
- assertVisible:
    id: game-placeholder
- tapOn:
    id: tab-saved
- assertVisible:
    id: saved-placeholder
- tapOn:
    id: tab-home
- assertVisible:
    id: word-lemma
