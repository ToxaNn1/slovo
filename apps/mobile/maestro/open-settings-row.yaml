# Opens Settings and scrolls to one of its rows, off the tab bar, which covers
# the bottom of the list at the largest font size. While the Profile is shown,
# the fourth tab is the Profile and Settings opens from its tile; otherwise the
# tab is Settings itself. The caller passes the row's id as `ROW`, e.g.
# `ROW: settings-row-my-mix`, and leaves Settings by `settings-back` before
# tapping another tab: the tab bar shows on tab roots only.
appId: ${APP_ID || 'app.slovo.uk'}
---
- tapOn:
    id: tab-settings
- runFlow:
    when:
      visible:
        id: profile
    commands:
      - scrollUntilVisible:
          element:
            id: profile-settings
          direction: UP
      # `open-in-dev-client.yaml` parks the development client's floating
      # tools button at the top right, right over the tile, and Maestro does
      # not see the button. Drag from the tile's spot down the right edge: the
      # button stays there, clear of the tile; with no button there, the drag
      # only pulls the list. It is not dragged back: a drag that counts as a
      # tap opens the development client's menu.
      - swipe:
          start: 90%, 11%
          end: 90%, 66%
          duration: 600
      - waitForAnimationToEnd
      - runFlow:
          file: dismiss-dev-menu.yaml
      - tapOn:
          id: profile-settings
# On a busy machine the scroll may run past the row before it is seen, leaving
# it under the header: then scroll back up to it.
- scrollUntilVisible:
    element:
      id: ${ROW}
    centerElement: true
    visibilityPercentage: 50
    optional: true
- scrollUntilVisible:
    element:
      id: ${ROW}
    direction: UP
    centerElement: true
    visibilityPercentage: 50
# A tap on a list still gliding only stops it: let it settle first.
- waitForAnimationToEnd
